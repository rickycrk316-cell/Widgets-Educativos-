/* ---------- Navegación adaptable ---------- */

var ul=mk('ul','sd-list');

function spy(){var cur=null,k=($('.tab.on')||{getAttribute:function(){}}).getAttribute('data-tab');heads.forEach(function(x){if(x.k!==k||!x.h.offsetParent)return;if(x.h.getBoundingClientRect().top<=140)cur=x});heads.forEach(function(x){x.a.classList.toggle('cur',x===cur)})}

/* ---------- Ejercicio «Ordenar» ---------- */
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t}return b}

function flip(els,first,stagger,dur){if(rm())return;els.forEach(function(e,i){var a=first[i],b=rect(e),dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy||!e.animate)return;e.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:dur||280,delay:(stagger||0)*i,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'})})}
function cleanHtml(src){var d=document.createElement('div');d.innerHTML=src;$$('[id]',d).forEach(function(e){e.removeAttribute('id')});return d}
function ordItems(ol){

var ls=Array.prototype.filter.call(ol.children,function(n){return n.tagName==='LI'});if(ls.length<2||!ls.every(function(l){return l.getAttribute('data-paso')}))return null;return ls.map(function(l){return{f:l.getAttribute('data-paso'),h:l.innerHTML}})}
function initOrd(){$$('section.tab ol.tl, section.tab ol.steps.tg').forEach(function(ol){var items=ordItems(ol);if(items)mkOrd(ol,items)})}
function mkOrd(ol,items){
var n=items.length,bar=mk('div','ord-bar'),go=btn('Ordenar',function(){box?close():open()},'chip ord-go');go.setAttribute('aria-expanded','false');bar.appendChild(go);bar.appendChild(mk('span','mini','Recuerdo activo: ordena de memoria los '+n+' pasos y revisa.'));ol.parentNode.insertBefore(bar,ol);
var box=null,chips,slots,bank,st,sel,done,drag,lastDrag=0,bRev,rev;
function open(){box=build();bar.parentNode.insertBefore(box,ol);ol.classList.add('ol-off');ol._ordExit=close;go.textContent='Salir';go.classList.add('on');go.setAttribute('aria-expanded','true')}
function close(){if(box&&box.parentNode)box.parentNode.removeChild(box);box=null;ol.classList.remove('ol-off');ol._ordExit=null;go.textContent='Ordenar';go.classList.remove('on');go.setAttribute('aria-expanded','false')}
function say(t){if(st)st.textContent=t}
function build(){
done=false;sel=null;drag=null;
var b=mk('div','ord');b.appendChild(mk('div','ord-h','Ordena los '+n+' pasos'));b.appendChild(mk('p','mini','Arrastra cada frase a su hueco, o toca la frase y luego el hueco. «Revisar» corrige y explica cada paso. Nada se guarda.'));
bank=mk('div','ord-bank');bank.setAttribute('aria-label','Frases por ordenar');
chips=items.map(function(it,i){var c=mk('button','ord-chip',it.f);c.type='button';c.setAttribute('data-i',i);return c});
slots=items.map(function(it,i){var li=mk('li','ord-slot');li.setAttribute('data-i',i);var nn=mk('span','ord-n',String(i+1));var d=mk('div','ord-drop');d.setAttribute('role','button');d.tabIndex=0;d.setAttribute('aria-label','Hueco '+(i+1));d.setAttribute('data-i',i);li.appendChild(nn);li.appendChild(d);return{li:li,drop:d}});
var sl=mk('ol','ord-slots');slots.forEach(function(s){sl.appendChild(s.li)});
var ob=mk('div','ord-btns');rev=btn('Revisar',review,'go');var rs=btn('Reiniciar',reset,'chip');ob.appendChild(rev);ob.appendChild(rs);
st=mk('div','ord-st');st.setAttribute('aria-live','polite');
b.appendChild(bank);b.appendChild(sl);b.appendChild(ob);b.appendChild(st);
scramble(false);
b.addEventListener('pointerdown',down);
b.addEventListener('click',click);
b.addEventListener('keydown',function(e){var d=e.target.closest&&e.target.closest('.ord-drop');if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();click({target:d})}});
b.addEventListener('touchmove',function(e){if(drag&&drag.on&&e.cancelable)e.preventDefault()},{passive:false});
return b}
function scramble(anim){var first=chips.map(rect),o=chips.slice(),k=0;do{o=shuffle(chips);k++}while(k<6&&o.every(function(c,i){return c===chips[i]}));o.forEach(function(c){bank.appendChild(c)});if(anim&&box)flip(chips,first,25,320)}
function put(c,target){if(done)return;var from=c.parentNode;if(target===from){return}var occ=target!==bank?target.firstElementChild:null,mv=[c];if(occ&&occ!==c)mv.push(occ);var first=mv.map(rect);c.style.transform='';c.classList.remove('drag');target.appendChild(c);if(occ&&occ!==c)from.appendChild(occ);flip(mv,first,0,260);mark()}
function mark(){chips.forEach(function(c){var s=c===sel;c.classList.toggle('sel',s);c.setAttribute('aria-pressed',s?'true':'false')});var left=bank.children.length;if(!done)say(sel?'Frase elegida: toca el hueco donde va.':(left?'Faltan '+left+' frases por colocar.':'Todo colocado: pulsa Revisar.'))}
function click(e){if(done||Date.now()-lastDrag<120)return;var t=e.target,c=t.closest&&t.closest('.ord-chip');
if(c){if(sel&&sel!==c){var tg=c.parentNode;put(sel,tg===bank?bank:tg);sel=null;mark()}else{sel=sel===c?null:c;mark()}return}
var d=t.closest&&t.closest('.ord-drop');if(!d){var sli=t.closest&&t.closest('.ord-slot');if(sli)d=$('.ord-drop',sli)}
if(d&&sel){put(sel,d);sel=null;mark();return}
if(t.closest&&t.closest('.ord-bank')&&sel){put(sel,bank);sel=null;mark()}}
/* arrastre: ratón tras 5 px; táctil tras pulsar ~220 ms (antes de eso el dedo desplaza la página) */
function down(e){if(done||e.button>0)return;var c=e.target.closest('.ord-chip');if(!c)return;var s={c:c,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType==='touch'||e.pointerType==='pen',t:0};drag=s;if(s.touch)s.t=setTimeout(function(){if(drag===s&&!s.on)start(s)},220);document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cancel)}

function move(e){var s=drag;if(!s)return;var dx=e.clientX-s.x,dy=e.clientY-s.y;if(!s.on){var d=Math.hypot(dx,dy);if(s.touch){if(d>9){clearTimeout(s.t);end()}return}if(d>5)start(s);else return}
s.c.style.transform='translate('+dx+'px,'+dy+'px)';var tg=under(e.clientX,e.clientY);slots.forEach(function(x){x.li.classList.toggle('over',tg&&tg===x.drop)})}
function under(x,y){var l=document.elementsFromPoint(x,y);for(var i=0;i<l.length;i++){var e=l[i];if(e.classList&&!e.classList.contains('ord-chip')){if(e.classList.contains('ord-drop'))return e;if(e.classList.contains('ord-slot'))return $('.ord-drop',e);if(e.classList.contains('ord-bank'))return e}}return null}
function up(e){var s=drag;if(!s)return;if(s.on){lastDrag=Date.now();var tg=under(e.clientX,e.clientY),c=s.c;slots.forEach(function(x){x.li.classList.remove('over')});if(tg&&tg!==c.parentNode)put(c,tg);else{var f=[rect(c)];c.style.transform='';c.classList.remove('drag');flip([c],f,0,240)}}end()}
function cancel(){var s=drag;if(s&&s.on){s.c.style.transform='';s.c.classList.remove('drag');slots.forEach(function(x){x.li.classList.remove('over')})}end()}
function end(){if(drag)clearTimeout(drag.t);drag=null;document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel)}
function review(){if(done)return;done=true;sel=null;box.classList.add('done');rev.disabled=true;
var ok=0;chips.forEach(function(c){var p=c.parentNode;c._u=p.classList.contains('ord-drop')?parseInt(p.getAttribute('data-i'),10):-1;c.classList.remove('sel');c.disabled=true});
var first=chips.map(rect);
/* orden de huecos: cada frase vuelve a su sitio correcto */
slots.forEach(function(s,i){var c=chips[i];s.drop.appendChild(c)});
slots.forEach(function(s,i){var c=chips[i],good=c._u===i;if(good)ok++;s.li.classList.add(good?'ord-ok':'ord-ko');s.li.classList.remove('over');var m=mk('div','ord-mk',good?'✓ En su lugar':(c._u<0?'✗ Sin colocar · va en el paso '+(i+1):'✗ Lo habías puesto en el paso '+(c._u+1)+' · va en el paso '+(i+1)));s.li.insertBefore(m,null);var x=mk('div','ord-x');x.appendChild(cleanHtml(items[i].h));x.style.animationDelay=(i*90+220)+'ms';s.li.appendChild(x);s.drop.removeAttribute('tabindex');s.drop.removeAttribute('role')});
flip(chips,first,90,520);

done=false;sel=null;box.classList.remove('done');rev.disabled=false;slots.forEach(function(s){s.li.classList.remove('ord-ok','ord-ko');$$('.ord-mk,.ord-x',s.li).forEach(function(e){e.parentNode.removeChild(e)});s.drop.tabIndex=0;s.drop.setAttribute('role','button')});chips.forEach(function(c){c.disabled=false;c.classList.remove('sel')});scramble(true);mark()}
}

function init(){var f=$('.tb'),ph=[function(){$$('section.tab').forEach(initNodos)},initTg,initStk,initOrd,initPerlas,buildNav,function(){setEx('')},function(){$$('.dc').forEach(runDc)},function(){show(secK('pan')?'pan':(f?f.getAttribute('data-tab'):''))}];ph.forEach(function(p){try{p()}catch(e){if(window.console)console.error('kit v11:',e)}})}
