<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@@TITULO@@</title>
<style>
/* Vademécum: monografía impresa con índice de canto; filetes y tinta llevan la jerarquía, no las sombras */
:root{
--paper:#FBFBFC;--paper-2:#F1F2F5;--ink:#16181D;--ink-2:#3A3D46;--ink-3:#686C78;--rule:#D7D9E0;--rule-strong:#16181D;
--accent:#2342A6;--accent-ink:#1B358A;--accent-field:#EAEEFA;--on-accent:#FFFFFF;
--am:#7A4A06;--am-f:#FBF1DF;--ro:#9E1F1F;--ro-f:#FBE9E7;--ve:#2F5E12;--ve-f:#EBF3E1;--pu:#4C3FA8;--pu-f:#EEECFB;--co:#8E3517;--co-f:#FAEDE6;--rs:#8A2C52;--rs-f:#FAEAF1;
--f-serif:ui-serif,"New York","Iowan Old Style","Charter","Source Serif Pro",Georgia,"Times New Roman",serif;
--f-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
--r:3px;
/* alias de la v10 para compatibilidad */
--surface-0:var(--paper);--surface-1:var(--paper-2);--border:var(--rule);--border-accent:var(--accent);--bg-accent:var(--accent-field);--text-primary:var(--ink);--text-secondary:var(--ink-2);--text-muted:var(--ink-3);--text-accent:var(--accent-ink);--radius:var(--r);--font-sans:var(--f-sans);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121317;--paper-2:#1C1E24;--ink:#E7E8EC;--ink-2:#C3C5CD;--ink-3:#9497A3;--rule:#33363F;--rule-strong:#E7E8EC;--accent:#8EA4FF;--accent-ink:#B4C3FF;--accent-field:#1A2347;--on-accent:#0E1330;--am:#F2C27A;--am-f:#2C2112;--ro:#FF9D93;--ro-f:#341716;--ve:#A9D88A;--ve-f:#1A2A12;--pu:#BDB4FF;--pu-f:#221D44;--co:#F4AE8E;--co-f:#33201A;--rs:#F3A2C3;--rs-f:#331A26;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121317;--paper-2:#1C1E24;--ink:#E7E8EC;--ink-2:#C3C5CD;--ink-3:#9497A3;--rule:#33363F;--rule-strong:#E7E8EC;--accent:#8EA4FF;--accent-ink:#B4C3FF;--accent-field:#1A2347;--on-accent:#0E1330;--am:#F2C27A;--am-f:#2C2112;--ro:#FF9D93;--ro-f:#341716;--ve:#A9D88A;--ve-f:#1A2A12;--pu:#BDB4FF;--pu-f:#221D44;--co:#F4AE8E;--co-f:#33201A;--rs:#F3A2C3;--rs-f:#331A26;color-scheme:dark}
html{color-scheme:light dark;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--accent);color:var(--on-accent)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-sans);-webkit-text-size-adjust:100%;font-feature-settings:"kern" 1;text-rendering:optimizeLegibility;caret-color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 56px;background:transparent}
h1{font:600 26px/1.2 var(--f-serif);letter-spacing:-.012em;margin:6px 0 14px;padding-bottom:12px;border-bottom:2px solid var(--rule-strong);text-wrap:balance}
h2{font:600 19px/1.3 var(--f-serif);letter-spacing:-.006em;margin:40px 0 14px;padding-top:12px;border-top:1px solid var(--rule-strong);text-wrap:balance}
h3{font:600 16px/1.35 var(--f-serif);margin:20px 0 6px;text-wrap:balance}
p{margin:0 0 12px;text-wrap:pretty}
a{color:var(--accent-ink);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
button:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* índice de canto */
.tabs{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 0 0;border-bottom:2px solid var(--rule-strong);margin-bottom:16px;position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);scroll-snap-type:x proximity;scroll-padding-inline:56px}
.tabs-w{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.tabs-w::before,.tabs-w::after{content:"";position:absolute;top:0;bottom:2px;width:56px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6}
.tabs-w::before{left:0;background:linear-gradient(to left,transparent,var(--paper) 85%)}
.tabs-w::after{right:0;background:linear-gradient(to right,transparent,var(--paper) 85%)}
.tabs-w.ov-l::before,.tabs-w.ov-r::after{opacity:1}
.nodo,.signo,.qv,.dc,h2{scroll-margin-top:84px}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-height:44px;padding:9px 15px 8px;border:1px solid var(--rule);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:var(--paper-2);color:var(--ink-2);font:600 13px/1.2 var(--f-sans);letter-spacing:.01em;white-space:nowrap;scroll-snap-align:start}
.tb:hover{background:var(--accent-field);color:var(--accent-ink)}
.tb.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.tab{display:none}
.tab.on{display:block}
/* recuadros */
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.6}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.mini{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:6px 0}
.hb{border-radius:var(--r);padding:12px 14px;margin:14px 0;border:1px solid transparent;font-size:15px;line-height:1.6}
.hb.az{background:var(--accent-field);color:var(--ink);border-color:var(--accent)}
.hb.am{background:var(--am-f);color:var(--am);border-color:var(--am)}
.hb.ro{background:var(--ro-f);color:var(--ro);border-color:var(--ro)}
.hb.ve{background:var(--ve-f);color:var(--ve);border-color:var(--ve)}
.hb.am .mini,.hb.ro .mini,.hb.ve .mini{color:inherit;opacity:.88}
.hb-t{font:600 16px/1.35 var(--f-serif);margin-bottom:6px;text-wrap:balance}
.hb.az .hb-t{color:var(--accent-ink)}
.pg{margin:0;padding-left:22px}
.pg li{margin:5px 0}
.pg li::marker{color:var(--accent-ink);font-weight:700}
.hb.az:has(.pg){margin-bottom:24px}
.hb.az:not(:has(.pg)):not(.rec-go){background:transparent;border-left-color:transparent;border-right-color:transparent;border-radius:0;padding-left:0;padding-right:0}
.hb.az:not(:has(.pg))+.etapa{border-top:0}
h2+.card,h2+.hb,h2+.tw{margin-top:0}
.badge{display:inline-block;font:700 11px/1.4 var(--f-sans);letter-spacing:.04em;padding:2px 7px;border-radius:2px;margin:0 4px 4px 0;vertical-align:middle;border:1px solid currentColor}
.b-az{background:var(--accent-field);color:var(--accent-ink)}
.b-ro{background:var(--ro-f);color:var(--ro)}
.b-am{background:var(--am-f);color:var(--am)}
.b-ve{background:var(--ve-f);color:var(--ve)}
.b-pu{background:var(--pu-f);color:var(--pu)}
.badge.b-pu{display:block;width:fit-content;max-width:100%;white-space:normal;font-size:12px;line-height:1.5;font-weight:600;letter-spacing:.01em;margin:14px 0}
.b-co{background:var(--co-f);color:var(--co)}
.b-rs{background:var(--rs-f);color:var(--rs)}
.rem{display:inline-block;font-size:12.5px;background:var(--rs-f);color:var(--rs);border:1px dashed var(--rs);border-radius:2px;padding:1px 7px;margin:4px 0}
/* Feynman */
.fey{background:var(--co-f);border:1px solid var(--co);border-radius:var(--r);padding:14px 16px;margin:18px 0 26px}
.fey-t{display:inline-block;font:600 15px/1.35 var(--f-serif);color:var(--co);margin-bottom:8px}
.fey-b{margin:0 0 10px;font:400 16px/1.6 var(--f-serif);color:var(--ink)}
.fey-c{margin:2px 0;color:var(--ink-2)}
/* Panorama: entradas de índice */
.tab{counter-reset:et}
.etapa{counter-increment:et;background:transparent;border:0;border-top:1px solid var(--rule);border-radius:0;padding:18px 0 8px;margin:4px 0}
.etapa h3{font-size:19px;line-height:1.3;margin:0 0 8px}
.etapa h3::before{content:counter(et,decimal-leading-zero);font:700 12px/1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--accent-ink);margin-right:10px;vertical-align:2px}
.res{margin:0 0 10px}
.perla{border-top:1px dotted var(--rule);padding-top:8px;margin:0 0 10px;font-weight:500}
.perla::before{content:"Perla";display:inline-block;font:700 11px/1.4 var(--f-sans);letter-spacing:.07em;text-transform:uppercase;background:var(--ve-f);color:var(--ve);border:1px solid var(--ve);border-radius:2px;padding:1px 6px;margin-right:8px;vertical-align:1px}
.go{min-height:44px;padding:8px 16px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent);color:var(--on-accent);font:600 13.5px/1.2 var(--f-sans)}
.go:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
/* tablas de monografía */
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums}
th,td{border:0;border-bottom:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--paper-2);font-weight:700;color:var(--ink)}
thead th{font:700 14.5px/1.35 var(--f-sans);font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--ink-2);border-top:2px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong)}
tbody tr:last-child>*{border-bottom:1px solid var(--rule-strong)}
.stats{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media (min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:transparent;border:0;border-top:2px solid var(--accent);border-radius:0;padding:8px 2px}
.stat b{display:block;font:600 22px/1.25 var(--f-serif);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.4;display:block}
.steps{list-style:none;counter-reset:st;padding:0;margin:10px 0}
.steps>li{counter-increment:st;position:relative;padding:5px 0 9px 40px}
.steps>li::before{content:counter(st);position:absolute;left:0;top:3px;width:26px;height:26px;border-radius:2px;background:var(--ink);color:var(--paper);font:700 12px/1 var(--f-sans);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
/* cascada */
.tl{list-style:none;margin:14px 0;padding:0 0 0 20px;border-left:2px solid var(--accent)}
.nodo{position:relative;margin:0 0 14px;padding:11px 13px;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);font-size:14px;line-height:1.55}
.nodo::before{content:"";position:absolute;left:-27px;top:15px;width:12px;height:12px;border-radius:1px;background:var(--accent);box-shadow:0 0 0 3px var(--paper)}
.paso{display:block;font:600 15px/1.4 var(--f-serif);margin-bottom:5px}
.pn{color:var(--accent-ink);margin-right:4px;font-variant-numeric:tabular-nums}
.man{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.signo{background:var(--paper);border:1px solid var(--rule);border-top:2px solid var(--rule-strong);border-radius:0 0 var(--r) var(--r);padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.55}
.signo h4{margin:0 0 6px;font:600 15.5px/1.35 var(--f-serif)}
.signo dl{margin:0}
.signo dt{font:700 13.5px/1.4 var(--f-sans);font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--ink-3);margin-top:8px}
.signo dd{margin:2px 0 0}
.xref{display:inline-flex;align-items:center;min-height:44px;padding:4px 10px;margin:3px 6px 3px 0;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-field);color:var(--accent-ink);font:600 12.5px/1.3 var(--f-sans);text-align:left}
.xref:hover{background:var(--accent);color:var(--on-accent)}
p .xref,td .xref,li .xref,dd .xref{display:inline;position:relative;min-height:0;padding:0 5px;margin:0 2px;line-height:inherit;border-radius:2px;white-space:normal;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
p .xref::after,td .xref::after,li .xref::after,dd .xref::after{content:"";position:absolute;left:-4px;right:-4px;top:-12px;bottom:-12px}
.hl{outline:2px solid var(--accent);background:var(--accent-field)!important;transition:background .3s}
.acc{border:1px solid var(--rule);border-radius:var(--r);margin:12px 0;overflow:hidden}
.acc-h{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:9px 14px;border:0;background:var(--paper-2);font:600 14px/1.35 var(--f-sans);text-align:left}
.acc-h:hover{background:var(--accent-field)}
.chev{transition:transform .2s;color:var(--accent-ink)}
.acc.op .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:10px 14px;font-size:14px;line-height:1.55}
.acc.op .acc-b{display:block}
.vanc{font-size:12.5px;line-height:1.5;padding-left:24px}
.vanc li{margin:5px 0;word-break:break-word}
.vanc li::marker{font-variant-numeric:tabular-nums;color:var(--ink-3)}
/* simulador */
.dc{border:1px solid var(--rule-strong);border-radius:var(--r);padding:14px 16px;margin:22px 0;background:var(--paper)}
.dc-t{font:600 16px/1.35 var(--f-serif);color:var(--accent-ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.dc-g{margin:10px 0}
.dc-l{font:700 13.5px/1.4 var(--f-sans);font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--ink-2);margin-bottom:5px;display:block}
.chip{min-height:44px;padding:7px 13px;margin:3px 6px 3px 0;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-2);font-size:13.5px}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.dc input[type=number]{min-height:44px;width:120px;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper);color:var(--ink);font:15px var(--f-sans);font-variant-numeric:tabular-nums}
.out{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--paper-2);border:1px solid var(--rule);font-size:14px;line-height:1.58;min-height:44px}
.tag{display:inline-block;font:600 11px/1.4 var(--f-sans);padding:1px 7px;border-radius:2px;background:var(--accent-field);color:var(--accent-ink);margin:4px 4px 0 0}
.rec-bar{border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.5;background:var(--paper)}
.rec-bar textarea{width:100%;min-height:120px;margin-top:8px;padding:9px 11px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper-2);color:var(--ink);font:14px/1.55 var(--f-sans);resize:vertical}
.chip:disabled{cursor:default;opacity:.85}
.rec-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rec-ctl{display:none;gap:6px;margin-top:6px}
.recon .rec-ctl{display:flex}
.recon>*:not(.rec-bar):not(.tl){display:none}
.recon .nodo:not(.rev) .pt{display:none}
.recon .nodo:not(.rev) .pn::after{content:" ?"}
.recon .nodo:not(.rev) .det{display:none}
.recon .nodo.pis:not(.rev) .det{display:block}
.recon .nodo.pis:not(.rev) .det>*:not(.man){display:none}
.recon .nodo:not(.pis):not(.rev) .man{display:none}
.recon .nodo.rev{border-color:var(--accent)}
.rec-go{margin:22px 0}
.steps.tg>li{padding-left:40px}
span.tg{display:inline-block;font:700 11px/1.4 var(--f-mono);letter-spacing:.02em;padding:2px 7px;margin:0 6px 2px 0;border-radius:2px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
span.tg[data-t="clave"]{background:var(--accent-field);color:var(--accent-ink);border-color:var(--accent)}
span.tg[data-t="ok"]{background:var(--ve-f);color:var(--ve);border-color:var(--ve)}
span.tg[data-t="cond"]{background:var(--am-f);color:var(--am);border-color:var(--am)}
span.tg[data-t="no"]{background:var(--rs-f);color:var(--rs);border-color:var(--rs)}
span.tg[data-t="alarma"]{background:var(--ro-f);color:var(--ro);border-color:var(--ro)}
.qv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.qv p{margin:0;padding:9px 11px;border-radius:var(--r);border:1px solid var(--rule);background:var(--paper-2);font-size:13.5px;line-height:1.45}
.qv p::before{display:block;font:700 10.5px/1.4 var(--f-sans);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;color:var(--ink-3)}
.qv p[data-e="p"]{background:var(--accent-field);border-color:var(--accent)}
.qv p[data-e="p"]::before{content:"Presente";color:var(--accent-ink)}
.qv p[data-e="v"]::before{content:"Variable"}
.qv p[data-e="a"]{border:1px dashed var(--rule);color:var(--ink-3);background:transparent}
.qv p[data-e="a"]::before{content:"Ausente"}
.qv p[data-e="k"]{grid-column:1/-1;border:2px solid var(--accent);background:var(--accent-field);font-size:14.5px}
.qv p[data-e="k"]::before{content:"Signo clave";color:var(--accent-ink)}
.hb.vi{background:var(--pu-f);color:var(--pu);border-color:var(--pu)}
.hb.vi .mini{color:inherit;opacity:.88}
table.vis{min-width:620px}
table.vis td{min-width:140px}
table.vis tr>:first-child{position:-webkit-sticky;position:sticky;left:0;z-index:1;background:var(--paper-2);min-width:118px;max-width:150px;font-weight:700;border-right:1px solid var(--rule)}
.vb-bar{border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.5;background:var(--paper)}
.tbl>*:not(.vb-bar):not(.vis-w){display:none}
.tbl td.tap{cursor:pointer}
.tbl td.tap:not(.rev){color:transparent;background:repeating-linear-gradient(135deg,var(--paper-2),var(--paper-2) 7px,var(--accent-field) 7px,var(--accent-field) 14px)}
.tbl td.tap:not(.rev) *{visibility:hidden}
.tbl td.tap.rev{box-shadow:inset 0 0 0 1px var(--accent)}
.cf{display:block;margin-top:10px;padding-top:8px;border-top:1px dashed var(--accent);font-style:italic;color:var(--ink-2)}
.cf::before{content:"Contrafactual · ";font-style:normal;font-weight:700;color:var(--accent-ink)}
.fig{margin:14px 0}
.fig img{display:block;max-width:100%;height:auto;border-radius:var(--r);border:1px solid var(--rule)}
.fig figcaption{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:6px}
@media (min-width:700px){body{font-size:15.5px}.wrap{padding:22px 24px 64px}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* v10.2 · Diagramas de bloques y flechas (causa-efecto, mecanismo, representación) */
.dg{margin:16px 0;padding:12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-2);max-width:100%;overflow-wrap:anywhere}
.dg-t{font:600 15px/1.35 var(--f-serif);margin:0 0 10px}
.dg figcaption{margin-top:10px}
.dg-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.dg-col{display:flex;flex-direction:column;gap:6px;flex:0 1 220px;min-width:0}
.dg-n{border:1px solid var(--ink-3);border-radius:var(--r);background:var(--paper);color:var(--ink);padding:7px 10px;font-size:13.5px;line-height:1.4;min-width:0;max-width:100%}
.dg-row>.dg-n{flex:0 1 220px}
.dg-n.b{background:var(--co-f);border-color:var(--co);color:var(--co)}
.dg-n.p{background:var(--pu-f);border-color:var(--pu);color:var(--pu)}
.dg-n.s{background:var(--ve-f);border-color:var(--ve);color:var(--ve)}
.dg-n.fr{background:var(--am-f);border-color:var(--am);color:var(--am)}
