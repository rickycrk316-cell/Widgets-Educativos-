:root[data-theme="dark"][data-tema="pediatria-ortopedia"]{--accent:#7bbbe8;--accent-ink:#a3d0f0;--accent-field:#14293a;--on-accent:#06192a}
:root[data-theme="dark"][data-tema="ginecologia"]{--accent:#ee8aa8;--accent-ink:#f4a9c0;--accent-field:#331a25;--on-accent:#3a0a1f}
:root[data-theme="dark"][data-tema="salud-mental"]{--accent:#9fb0f0;--accent-ink:#bcc8f6;--accent-field:#1d2340;--on-accent:#101640}
:root[data-theme="dark"][data-tema="digestivo"]{--accent:#5fc4d4;--accent-ink:#8ad8e4;--accent-field:#12292e;--on-accent:#04202a}
:root[data-theme="dark"][data-tema="urologia"]{--accent:#e3b25a;--accent-ink:#eecb85;--accent-field:#2e2410;--on-accent:#2b1a02}
html{color-scheme:light dark;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
:root[data-theme="light"]{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--accent);color:var(--on-accent)}
body{margin:0;background-color:var(--bg);background-image:var(--u-vena);background-size:1200px 1200px;color:var(--ink);font:18px/1.62 var(--f-text);-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;caret-color:var(--accent);font-variant-numeric:lining-nums}
.wrap{position:relative;max-width:900px;margin:0 auto;padding:max(22px,env(safe-area-inset-top,0px)) 16px 40px}
.nv .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* cabecera: frontón, título lapidario y greca */
h1{position:relative;font:600 26px/1.2 var(--f-disp);letter-spacing:.03em;margin:6px 0 26px;padding:24px 0 26px;text-wrap:balance;color:var(--ink)}
h1::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:var(--u-fronton) 0 0/100% 100% no-repeat}
h1::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--u-greca) 0 0/auto 12px repeat-x}
h2{font:600 21px/1.28 var(--f-disp);letter-spacing:.025em;margin:46px 0 16px;padding-bottom:10px;background:linear-gradient(var(--oro),var(--oro)) 0 100%/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 calc(100% - 4px)/100% 1px no-repeat;text-wrap:balance}
h3{font:600 20px/1.3 var(--f-text);letter-spacing:.005em;margin:24px 0 8px;text-wrap:balance}
h4{font:600 17.5px/1.35 var(--f-text);margin:0 0 6px}
p{margin:0 0 12px;text-wrap:pretty}
a{color:var(--accent-ink);text-underline-offset:3px}
b,strong{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out,box-shadow .2s ease-out,transform .2s ease-out}
button:active{transform:scale(.985)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nodo,.signo,.qv,.dc,.etapa,h2,h3,.ord{scroll-margin-top:18px}
/* pestañas (la barra original se oculta cuando el script construye la navegación adaptable) */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-height:44px;padding:9px 16px;border:1px solid var(--line);border-top:3px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-2);font:600 16px/1.2 var(--f-text);white-space:nowrap;box-shadow:var(--sh)}
.tb.on{background:var(--marmol-2);border-top-color:var(--oro);color:var(--accent-ink)}
.nv nav.tabs{display:none}
.tab{display:none}
.tab.on{display:block;animation:tabin .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* navegación adaptable */
nav.side,nav.bottom{display:none}
.perla-filtro{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pf-t{flex:1 0 100%;font:italic 400 15px/1.3 var(--f-text);color:var(--ink-3)}
.pf-b{min-height:36px;padding:5px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-2);font:600 14.5px/1.2 var(--f-text)}
.pf-b:hover{border-color:var(--accent);color:var(--accent-ink)}
.pf-b.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pf-n{flex:1 0 100%;font-size:14px;color:var(--ink-3);line-height:1.3}
@media (min-width:760px){
/* menú lateral: columna de mármol con acanaladuras y frontón */
.nv nav.side{display:flex;flex-direction:column;gap:16px;position:fixed;z-index:10;top:16px;bottom:16px;left:max(16px,calc((100vw - 1240px)/2 + 16px));width:236px;padding:16px 14px 16px 22px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:var(--sh);scrollbar-width:thin}
.nv nav.side::before{content:"";flex:0 0 14px;margin:0 -6px -2px -12px;background:var(--u-fronton) 0 0/100% 100% no-repeat}
.nv nav.side::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--u-flautas) 0 0/10px 8px repeat-y;opacity:.9;pointer-events:none}
.sd-brand{font:600 14.5px/1.35 var(--f-disp);letter-spacing:.03em;padding:0 4px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sd{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-left:3px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);font:600 16px/1.25 var(--f-text);text-align:left}
.sd:hover{background:var(--surface-2);color:var(--ink)}
.sd-g.on>.sd{background:var(--surface-2);border-left-color:var(--oro);color:var(--accent-ink)}
.sd-i{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font:600 12px/1 var(--f-disp);color:var(--ink-2)}
.sd-g.on>.sd .sd-i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sd-h{display:none;list-style:none;margin:2px 0 8px 22px;padding:0 0 0 12px;border-left:1px solid var(--oro)}
.sd-g.on>.sd-h{display:block}
.sl{display:block;padding:5px 8px;border-radius:var(--r-sm);font-size:15px;line-height:1.3;color:var(--ink-3);text-decoration:none}
.sl:hover{color:var(--ink);background:var(--surface-2)}
.sl.cur{color:var(--accent-ink);font-weight:600}
.wrap{max-width:1240px;padding:28px 28px 64px 288px}
.nv .wrap{padding-bottom:64px}
h1{font-size:31px}
.wrap::before{content:"";position:absolute;right:30px;top:34px;width:84px;height:84px;background:var(--u-sol) 0 0/contain no-repeat;opacity:.5;pointer-events:none}
}
@media (min-width:760px) and (max-width:999px){
.nv nav.side{width:210px}
.wrap,.nv .wrap{padding-left:250px;padding-right:22px}
.wrap::before{display:none}
}
@media (max-width:759px){
/* barra inferior: estilóbato (peldaños de mármol) */
.nv nav.bottom{display:flex;position:fixed;z-index:20;left:0;right:0;bottom:0;align-items:stretch;background:var(--surface);border-top:1px solid var(--oro);padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:0 -3px 0 var(--surface-2),0 -4px 0 var(--line-2),0 -6px 18px rgba(70,50,25,.10)}
.bn-scroll{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.bn-scroll::-webkit-scrollbar{display:none}
.bn{position:relative;flex:0 0 80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:60px;padding:8px 3px 6px;border:0;background:transparent;color:var(--ink-3);font:600 13px/1.15 var(--f-text);text-align:center;scroll-snap-align:start}
.bn-i{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;padding:0 7px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font:600 12px/1 var(--f-disp);transition:background-color .2s,color .2s}
.bn-l{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;overflow-wrap:anywhere}
.bn.on{color:var(--accent-ink)}
.bn.on::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:3px;background:var(--oro)}
.bn.on .bn-i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bn.bn-f{flex:0 0 66px;border-right:1px solid var(--line);color:var(--ink-2)}
.bn.bn-f.on .bn-i,.bn.bn-f.act .bn-i{background:var(--accent-field);border-color:var(--accent);color:var(--accent-ink)}
.bn-pop{display:none;position:absolute;left:10px;right:10px;bottom:calc(100% + 10px);padding:14px;background:var(--surface);border:1px solid var(--line-2);border-top:3px solid var(--oro);border-radius:var(--r-sm);box-shadow:var(--sh-up)}
.bn-pop.open{display:block;animation:tabin .2s ease-out both}
}
/* tarjetas de mármol y recuadros */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0;font-size:17px;line-height:1.58;box-shadow:var(--sh)}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.mini{font-size:14.5px;color:var(--ink-3);line-height:1.5;margin:6px 0}
.hb{border-radius:var(--r);padding:16px 18px;margin:16px 0;border:1px solid transparent;border-left:4px solid currentColor;font-size:17px;line-height:1.58}
.hb.az{background:var(--surface);border-color:var(--line);border-left-color:var(--oro);box-shadow:var(--sh);color:var(--ink)}
.hb.am{background:var(--am-f);color:var(--am)}
.hb.ro{background:var(--ro-f);color:var(--ro)}
.hb.ve{background:var(--ve-f);color:var(--ve)}
.hb.vi{background:var(--pu-f);color:var(--pu)}
.hb.am .mini,.hb.ro .mini,.hb.ve .mini,.hb.vi .mini{color:inherit;opacity:.9}
.hb-t{font:600 17.5px/1.35 var(--f-text);margin-bottom:8px;text-wrap:balance}
.hb.az .hb-t{color:var(--accent-ink);font:italic 400 17px/1.35 var(--f-text)}
.hb.az:not(:has(.pg)){background:var(--marmol-2);border:0;border-top:2px solid var(--oro);border-bottom:1px solid var(--line-2);border-radius:0;box-shadow:none;font-size:19.5px;line-height:1.55;padding:20px 22px}
.hb.az:not(:has(.pg)) .hb-t{color:var(--accent-ink)}
.pg{margin:0;padding-left:0;list-style:none;counter-reset:pg}
.pg li{counter-increment:pg;position:relative;margin:0;padding:9px 0 9px 36px;border-top:1px solid var(--line)}
.pg li:first-child{border-top:0}
.pg li::before{content:counter(pg);position:absolute;left:0;top:11px;width:24px;height:24px;border:1px solid var(--accent);border-radius:2px;background:var(--accent-field);color:var(--accent-ink);font:600 12px/22px var(--f-disp);text-align:center}
.hb.az:has(.pg){margin-bottom:22px}
h2+.card,h2+.hb,h2+.tw{margin-top:0}
.badge{display:inline-block;font:600 14px/1.4 var(--f-text);padding:2px 10px;border-radius:var(--r-sm);margin:0 4px 4px 0;vertical-align:middle}
.b-az{background:var(--accent-field);color:var(--accent-ink)}
.b-ro{background:var(--ro-f);color:var(--ro)}
.b-am{background:var(--am-f);color:var(--am)}
.b-ve{background:var(--ve-f);color:var(--ve)}
.b-pu{background:var(--pu-f);color:var(--pu)}
.badge.b-pu{display:block;width:fit-content;max-width:100%;white-space:normal;font-size:15px;line-height:1.5;font-weight:500;border-radius:var(--r-sm);padding:6px 12px;margin:14px 0}
.b-co{background:var(--co-f);color:var(--co)}
.b-rs{background:var(--rs-f);color:var(--rs)}
.rem{display:inline-block;font-size:14.5px;background:var(--surface-2);color:var(--ink-2);border-radius:var(--r-sm);padding:2px 10px;margin:4px 0}
/* hojas de cuaderno: base común de .nucleo, .perla, .fey y .ord */
.nucleo,.perla,.fey,.ord{position:relative;color:var(--nota-ink);background:var(--u-grano),radial-gradient(ellipse at 50% 40%,var(--nota) 55%,var(--nota-2) 130%);border:1.5px solid var(--nota-borde);border-radius:7px 11px 8px 12px/11px 7px 12px 8px;box-shadow:inset 0 0 34px var(--nota-sombra),2px 3px 0 rgba(60,40,20,.10)}
.nucleo>*,.perla>*,.fey>*{position:relative}
.nucleo::before,.perla::before,.fey::before{content:"";position:absolute;pointer-events:none;background:var(--u-vitruvio) 0 0/contain no-repeat}
.nucleo::after,.perla::after,.fey::after{position:absolute;pointer-events:none;font:italic 400 14px/1 var(--f-hand);color:var(--nota-lin);transform:scaleX(-1);opacity:.55}
/* texto secundario dentro de las hojas: contraste ≥ 4.5:1 incluso en el borde envejecido */
.nucleo .mini,.perla .mini,.fey .mini,.ord .mini{color:var(--tinta-2);font-size:16px}
/* Feynman */
.fey{padding:22px 24px 26px;margin:22px 0 30px}
.fey::before{right:12px;top:10px;width:84px;height:84px;opacity:.38}
.fey::after{content:"así lo explico" / "";right:16px;bottom:8px}
.fey-t{display:block;font:italic 400 21px/1.3 var(--f-hand);color:var(--sanguina-nota);margin-bottom:10px;padding-right:90px}
.fey-b{margin:0 0 12px;font:400 19px/1.58 var(--f-text);color:var(--nota-ink)}
.fey-c{margin:2px 0;color:var(--tinta-2)}
/* Panorama */
.etapa{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--oro);border-radius:var(--r);padding:20px 22px 18px;margin:14px 0;box-shadow:var(--sh)}
.etapa h3{font:600 21px/1.3 var(--f-text);margin:0 0 10px}
.res{margin:0 0 12px}
.go{min-height:44px;padding:9px 20px;border:1px solid var(--accent);border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);font:600 16px/1.2 var(--f-text)}
.go:hover{filter:brightness(1.1)}
/* núcleo: el 20 % (hoja principal del cuaderno) */
.nucleo{margin:20px 0 28px;padding:22px 22px 26px}
.nucleo::before{right:12px;top:10px;width:92px;height:92px;opacity:.40}
.nucleo::after{content:"il nucleo" / "";right:16px;bottom:8px}
.nucleo-t{display:inline-block;font:italic 400 22px/1.2 var(--f-hand);color:var(--sanguina-nota);border-bottom:1.5px solid var(--sanguina);border-radius:0 0 40% 3px/0 0 6px 1px;padding:0 6px 3px 0;margin-bottom:14px}
.nucleo ul{list-style:none;margin:0;padding:0;counter-reset:nu}
.nucleo li{counter-increment:nu;position:relative;padding:5px 70px 9px 40px;font-size:18.5px;line-height:1.5;font-weight:500;color:var(--nota-ink)}
.nucleo li::before{content:counter(nu);position:absolute;left:0;top:6px;width:27px;height:27px;border:1.5px solid var(--nota-borde);border-radius:50% 46% 52% 48%;color:var(--sanguina-nota);font:600 13px/24px var(--f-disp);text-align:center}
/* perlas de examen (nota al margen) */
.perla{margin:20px 0;padding:16px 20px 20px;font-size:17px;line-height:1.55;background:var(--u-grano),radial-gradient(ellipse at 50% 40%,var(--nota-l,var(--nota)) 55%,var(--nota-2) 150%);border-width:1px;border-color:var(--tinta-2);border-radius:5px 9px 6px 10px/9px 5px 10px 6px;box-shadow:inset 0 0 26px var(--nota-sombra),1px 2px 0 rgba(60,40,20,.10)}
.perla::before{right:10px;top:8px;width:58px;height:58px;opacity:.30}
.perla::after{content:"perla" / "";right:14px;bottom:6px}
.perla.oc{display:none}
.perla-t{display:flex;align-items:center;gap:8px;font:italic 400 20px/1.3 var(--f-hand);color:var(--sanguina-nota);margin-bottom:6px;padding-right:60px}
.perla-t::before{content:"";flex:0 0 16px;height:16px;background:var(--u-estrella) 0 0/contain no-repeat}
.perla p{margin:0;padding-right:0}
p.perla{padding:12px 18px}
p.perla::before{content:"Perla";position:static;display:inline-block;width:auto;height:auto;opacity:1;background:var(--u-estrella) 0 50%/14px no-repeat;padding-left:19px;font:italic 400 19px/1.3 var(--f-hand);color:var(--sanguina-nota);margin-right:8px;vertical-align:0}
.perla-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-right:44px}
.ex{position:relative;min-height:28px;padding:3px 11px;border:1px solid var(--tinta-2);border-radius:2px;background:transparent;color:var(--tinta);font:600 14px/1.3 var(--f-text)}
.ex::after{content:"";position:absolute;inset:-9px -3px}
.ex.on{background:var(--sanguina);border-color:var(--sanguina);color:var(--on-accent)}
/* tablas */
.tw{overflow:auto;margin:14px 0;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);max-height:min(74vh,720px);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums lining-nums}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
td{min-width:112px}
th{font-weight:600}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font:600 14px/1.35 var(--f-disp);letter-spacing:.05em;color:var(--ink);border-bottom:2px solid var(--oro);white-space:nowrap}
tbody tr:last-child>*{border-bottom:0}
tbody tr:hover>*{background:var(--surface-2)}
table.vis{min-width:640px}
table.vis td{min-width:150px}
table.vis tr>:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:170px;max-width:230px;border-right:1px solid var(--line-2)}
table.vis thead tr>:first-child{z-index:3;background:var(--surface-2)}
table.vis tbody tr:hover>:first-child{background:var(--surface-2)}
th>span.q{display:block;font:600 16.5px/1.4 var(--f-text);color:var(--ink)}
th>span.qx{display:block;font:italic 400 14.5px/1.4 var(--f-text);color:var(--ink-3);margin-top:3px}
.stats{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
@media (min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--oro);border-radius:var(--r);padding:14px 18px 16px;box-shadow:var(--sh)}
.stat b{display:block;font:600 28px/1.2 var(--f-disp);letter-spacing:.01em;color:var(--accent-ink);font-variant-numeric:tabular-nums lining-nums}
.stat span{font-size:15.5px;color:var(--ink-2);line-height:1.4;display:block;margin-top:2px}
/* pasos */
.steps{list-style:none;counter-reset:st;padding:0;margin:12px 0;display:grid;gap:10px}
.steps>li{counter-increment:st;position:relative;padding:14px 16px 14px 58px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);font-size:17px;line-height:1.55}
.steps>li::before{content:counter(st);position:absolute;left:16px;top:14px;width:28px;height:28px;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:var(--on-accent);font:600 13px/26px var(--f-disp);font-variant-numeric:tabular-nums;text-align:center}
span.tg{display:inline-block;font:600 14px/1.4 var(--f-text);padding:1px 9px;margin:0 6px 2px 0;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
span.tg[data-t="clave"]{background:var(--accent-field);color:var(--accent-ink)}
span.tg[data-t="ok"]{background:var(--ve-f);color:var(--ve)}
span.tg[data-t="cond"]{background:var(--am-f);color:var(--am)}
span.tg[data-t="no"]{background:var(--rs-f);color:var(--rs)}
span.tg[data-t="alarma"]{background:var(--ro-f);color:var(--ro)}
/* cascada fisiopatológica */
.tl{list-style:none;margin:16px 0;padding:0 0 0 28px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:0;border-left:2px solid var(--oro)}
.nodo{position:relative;margin:0 0 12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);font-size:17px;line-height:1.55}
.nodo::before{content:"";position:absolute;left:-28px;top:19px;width:14px;height:14px;transform:rotate(45deg);background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.paso{display:block;font:600 18.5px/1.4 var(--f-text);margin-bottom:6px}
.pn{color:var(--accent-ink);margin-right:4px;font-variant-numeric:tabular-nums}
.man{margin:8px 0 0;font-size:16px;color:var(--ink-2)}
.signo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0;box-shadow:var(--sh);font-size:17px;line-height:1.55}
.signo h4{font-size:19px;margin-bottom:8px}
.signo dl{margin:0}
.signo dt{font:italic 400 16px/1.4 var(--f-text);color:var(--accent-ink);margin-top:10px}
.signo dd{margin:3px 0 0}
.xref{display:inline-flex;align-items:center;min-height:44px;padding:4px 14px;margin:3px 6px 3px 0;border:1px solid var(--accent);border-radius:var(--r-sm);background:var(--accent-field);color:var(--accent-ink);font:600 15px/1.3 var(--f-text);text-align:left}
.xref:hover{background:var(--accent);color:var(--on-accent)}
p .xref,td .xref,li .xref,dd .xref,.card .xref{display:inline;position:relative;min-height:0;padding:0 7px;margin:0 2px;line-height:inherit;font-size:.92em;white-space:normal;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
p .xref::after,td .xref::after,li .xref::after,dd .xref::after,.card .xref::after{content:"";position:absolute;left:-4px;right:-4px;top:-12px;bottom:-12px}
.hl{outline:2px solid var(--accent);background:var(--accent-field)!important;transition:background .3s}
.acc{border:1px solid var(--line-2);border-radius:var(--r);margin:14px 0;overflow:hidden;background:var(--surface);box-shadow:var(--sh)}
.acc-h{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:10px 18px;border:0;background:transparent;font:600 17px/1.35 var(--f-text);text-align:left}
.acc-h:hover{background:var(--surface-2)}
.chev{transition:transform .2s;color:var(--accent-ink)}
.acc.op .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:6px 18px 16px;font-size:16.5px;line-height:1.55}
.acc.op .acc-b{display:block;animation:tabin .25s ease-out both}
.vanc{font-size:15px;line-height:1.5;padding-left:28px}
.vanc li{margin:6px 0;word-break:break-word}
.vanc li::marker{font-variant-numeric:tabular-nums;color:var(--ink-3)}
/* simulador */
.dc{border:1px solid var(--line-2);border-top:3px solid var(--oro);border-radius:var(--r-lg);padding:20px 22px;margin:24px 0;background:var(--surface);box-shadow:var(--sh)}
.dc-t{font:600 18.5px/1.35 var(--f-disp);letter-spacing:.02em;color:var(--accent-ink);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dc-g{margin:12px 0}
.dc-l{font:italic 400 16px/1.4 var(--f-text);color:var(--ink-3);margin-bottom:6px;display:block}
.chip{min-height:44px;padding:8px 16px;margin:3px 6px 3px 0;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:16px;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.chip:disabled{cursor:default;opacity:.6}
.dc input[type=number]{min-height:44px;width:130px;padding:6px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:18px var(--f-text);font-variant-numeric:tabular-nums lining-nums}
.out{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);border-left:3px solid var(--oro);font-size:16.5px;line-height:1.6;min-height:48px}
.tag{display:inline-block;font:600 14px/1.4 var(--f-text);padding:2px 9px;border-radius:var(--r-sm);background:var(--accent-field);color:var(--accent-ink);margin:4px 4px 0 0}
.qv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.qv p{margin:0;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1.45;box-shadow:var(--sh)}
.qv p::before{display:block;font:italic 400 14.5px/1.4 var(--f-text);margin-bottom:4px;color:var(--ink-3)}
.qv p[data-e="p"]{background:var(--accent-field);border-color:transparent;box-shadow:none}
.qv p[data-e="p"]::before{content:"Presente";color:var(--accent-ink)}
.qv p[data-e="v"]::before{content:"Variable"}
.qv p[data-e="a"]{border:1px dashed var(--line-2);color:var(--ink-3);background:transparent;box-shadow:none}
.qv p[data-e="a"]::before{content:"Ausente"}
.qv p[data-e="k"]{grid-column:1/-1;border:1.5px solid var(--accent);background:var(--accent-field);font-size:17px;box-shadow:none}
.qv p[data-e="k"]::before{content:"Signo clave";color:var(--accent-ink)}
.cf{display:block;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-2);font-style:italic;color:var(--ink-2)}
.cf::before{content:"Contrafactual · ";font-style:normal;font-weight:600;color:var(--accent-ink)}
.fig{margin:16px 0}
.fig img{display:block;max-width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line)}
.fig figcaption{font-size:14.5px;color:var(--ink-3);line-height:1.5;margin-top:6px}
/* diagramas: papel de proporciones (cuadrícula de construcción) */
.dg{margin:18px 0;padding:16px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--u-cuadricula),var(--surface);box-shadow:var(--sh);max-width:100%;overflow-wrap:anywhere}
.dg-t{font:600 17.5px/1.35 var(--f-text);margin:0 0 12px}
.dg figcaption{margin-top:12px;font-size:14.5px;color:var(--ink-3);line-height:1.5}
.dg-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.dg-col{display:flex;flex-direction:column;gap:8px;flex:0 1 220px;min-width:0}
.dg-n{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);color:var(--ink);padding:9px 12px;font-size:15.5px;line-height:1.4;min-width:0;max-width:100%}
.dg-row>.dg-n{flex:0 1 220px}
.dg-n.b{background:var(--co-f);border-color:transparent;color:var(--co)}
.dg-n.p{background:var(--pu-f);border-color:transparent;color:var(--pu)}
.dg-n.s{background:var(--ve-f);border-color:transparent;color:var(--ve)}
.dg-n.fr{background:var(--am-f);border-color:transparent;color:var(--am)}
.dg-n.ac{background:var(--accent-field);border-color:transparent;color:var(--accent-ink)}
.dg-n.ro{background:var(--ro-f);border-color:transparent;color:var(--ro)}
.dg-ar{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:28px;color:var(--ink-3)}
.dg-ar::before{content:"→";order:2;font:400 22px/1 var(--f-text);color:var(--ink-3)}
.dg-lab{order:1;font-size:14px;line-height:1.3;color:var(--ink-3);text-align:center}
.duo>*{min-width:0}
.mini a{color:var(--accent-ink)}
/* elevación al pasar el cursor */
@media (hover:hover){.card,.nodo,.signo,.etapa,.dc,.stat,.perla,.steps>li,.qv p,.acc{transition:transform .2s ease-out,box-shadow .2s ease-out}.card:hover,.nodo:hover,.signo:hover,.etapa:hover,.dc:hover,.stat:hover,.perla:hover,.steps>li:hover,.qv p:hover,.acc:hover{transform:translateY(-2px);box-shadow:var(--sh-up)}.perla:hover{box-shadow:inset 0 0 26px var(--nota-sombra),2px 6px 14px rgba(60,40,20,.2)}}
.nodo:active,.signo:active,.steps>li:active,.etapa:active{transform:translateY(-2px);box-shadow:var(--sh-up)}
/* ejercicio de ordenar (generado por el script): hoja de ejercicio */
.ord-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.ord-bar .mini{margin:0;flex:1 1 220px}
.ord-go{margin:0;font-weight:600;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-field)}
.ord-go.on{background:var(--accent);color:var(--on-accent)}
.ol-off{display:none!important}
.ord{margin:12px 0 18px;padding:18px;border-width:1px;border-color:var(--tinta-2);animation:tabin .3s ease-out both}
.ord-h{font:italic 400 21px/1.35 var(--f-hand);color:var(--sanguina-nota)}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;margin:12px 0 16px;border-radius:var(--r);background:var(--surface);border:1.5px dashed var(--line-2)}
.ord-bank:empty::before{content:"Todas las frases están en un hueco";align-self:center;color:var(--ink-3);font-size:15.5px}
.ord-chip{position:relative;display:inline-flex;align-items:center;min-height:44px;max-width:100%;padding:9px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font:500 16.5px/1.35 var(--f-text);text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:var(--sh);touch-action:manipulation}
.ord-chip:hover{border-color:var(--accent)}
.ord-chip.sel{border-color:var(--accent);background:var(--accent-field);outline:2px solid var(--accent);outline-offset:1px}
.ord-chip.drag{z-index:60;cursor:grabbing;box-shadow:var(--sh-up);transition:none;touch-action:none;opacity:.96}
.ord-slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord-slot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line-2)}
.ord-n{display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-top:9px;border-radius:2px;background:var(--accent);color:var(--on-accent);font:600 13px/1 var(--f-disp)}
.ord-drop{display:flex;align-items:center;min-height:48px;border-radius:var(--r-sm);border:1.5px dashed var(--line-2);transition:background-color .15s,border-color .15s}
.ord-drop:empty::before{content:"Suelta o toca aquí";color:var(--ink-3);font-size:15px;padding:0 14px}
.ord-slot.over .ord-drop{border-color:var(--accent);background:var(--accent-field)}
.ord-drop .ord-chip{width:100%;box-shadow:none;border-color:transparent;background:var(--surface-2)}
.ord-drop .ord-chip.sel{border-color:var(--accent)}
.ord-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ord-st{margin:10px 0 0;font-size:15.5px;color:var(--ink-2);min-height:20px}
.ord.done .ord-chip{cursor:default;box-shadow:none}
.ord-slot.ord-ok{border-color:var(--ve);background:var(--ve-f)}
.ord-slot.ord-ko{border-color:var(--ro);background:var(--ro-f)}
.ord-slot.ord-ok .ord-drop,.ord-slot.ord-ko .ord-drop{border-style:solid;border-color:transparent}
.ord-slot.ord-ok .ord-n{background:var(--ve);color:var(--ve-f)}
.ord-slot.ord-ko .ord-n{background:var(--ro);color:var(--ro-f)}
.ord-mk{grid-column:2;font:600 15px/1.4 var(--f-text);padding:0 2px}
.ord-ok .ord-mk{color:var(--ve)}
.ord-ko .ord-mk{color:var(--ro)}
.ord-x{grid-column:1/-1;margin:2px 0 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:16.5px;line-height:1.55;animation:ordx .45s ease-out both}
.ord-x p:last-child{margin-bottom:0}
@keyframes ordx{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
