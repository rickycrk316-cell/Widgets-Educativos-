<script>
const TERMS={"t1": "Fatiga", "t2": "«No actúa como él mismo»", "t3": "Lúcido", "t4": "Somnoliento", "t5": "Estuporoso", "t6": "Inquietud", "t7": "Polidipsia", "t8": "Nocturia", "t9": "Estreñimiento", "pb": "Problemas", "jq": "Jerarquización", "hx": "Hipótesis"};
const DECKS={
t1:[{"q": "Al contraerse el músculo, el ATP se une a la cabeza de miosina y {{la suelta de la actina}}; sin ATP el puente cruzado queda unido y el músculo no se relaja.", "a": "la suelta de la actina", "h": "Ciclo de puentes cruzados."}, {"q": "¿De qué depende el esfuerzo percibido según el modelo de la descarga corolaria?", "a": "De la copia del comando motor central enviada a áreas sensitivas, y no solo de la señal que vuelve del músculo.", "h": "Comando motor, copia de eferencia."}, {"q": "¿Cómo se mide la fatiga como síntoma y cómo se llama la caída medible del rendimiento en una tarea?", "a": "La fatiga se mide por autorreporte; la caída medible del rendimiento es la fatigabilidad.", "h": "Enoka y Duchateau 2016."}, {"q": "Si la fuerza máxima está disminuida en el examen desde la primera contracción, el problema es {{debilidad (paresia)}} y no fatiga.", "a": "debilidad (paresia)", "h": "Se mide en el examen."}, {"q": "Un paciente refiere que le falta energía para actuar, pero no se queda dormido. ¿Fatiga o somnolencia?", "a": "Fatiga; la somnolencia es la tendencia a dormirse por baja alerta.", "h": "Alerta frente a energía."}, {"q": "El paciente del caso redujo sus salidas por la fatiga. ¿Qué dato del examen falta para separar fatiga de debilidad?", "a": "El examen de fuerza muscular, comparado entre el inicio y la repetición del esfuerzo.", "h": "Caso: B5."}],
t2:[{"q": "¿Qué dominio cognitivo del DSM-5-TR agrupa planificar, decidir, mantener datos en mente y corregir errores?", "a": "La función ejecutiva.", "h": "Corteza prefrontal."}, {"q": "¿Qué escala evalúa manejar la medicación, las finanzas, las compras y el teléfono, y a qué grupo de actividades pertenece?", "a": "La escala de Lawton, que evalúa actividades instrumentales de la vida diaria (AIVD).", "h": "Independencia en la comunidad."}, {"q": "¿Respecto de qué se define un cambio agudo del estado mental?", "a": "Respecto de la línea basal de la persona, que suele aportar un informante.", "h": "DSM-5-TR."}, {"q": "¿Qué dos rasgos temporales separan un cambio agudo del estado mental de uno crónico?", "a": "Inicio en horas o pocos días y curso que fluctúa durante el día.", "h": "DSM-5-TR; CAM."}, {"q": "«No actúa como él mismo» es una frase coloquial que orienta pero no establece un {{diagnóstico}}.", "a": "diagnóstico", "h": "Interpretación tomada."}, {"q": "En el caso, la línea basal depende de un hijo que visita ocasionalmente. ¿Qué limita esto y qué hay que preguntarle?", "a": "Limita la fiabilidad de la línea basal; hay que preguntarle qué hacía el padre solo hace un mes.", "h": "Caso: B1, S3."}],
t3:[{"q": "¿Qué función cumplen las proyecciones del sistema activador reticular ascendente al tálamo y a la corteza?", "a": "Mantener la corteza despierta (el nivel de alerta).", "h": "Tronco, hipotálamo y prosencéfalo basal."}, {"q": "El locus coeruleus sostiene la vigilia y la respuesta de alerta liberando {{noradrenalina}}.", "a": "noradrenalina", "h": "Núcleo del tronco."}, {"q": "¿Cuáles son los dos componentes de la conciencia y qué sustrato sostiene cada uno?", "a": "Nivel (alerta), por el sistema activador; contenido, por la corteza y sus redes.", "h": "Plum y Posner."}, {"q": "¿Qué dos cosas implica que alguien esté lúcido en la clínica?", "a": "Que está despierto (nivel normal) y que atiende y piensa con coherencia (contenido normal).", "h": "Interpretación tomada."}, {"q": "Un paciente responde bien la fecha y el lugar, pero se duerme a los pocos segundos. ¿Qué falla: orientación o alerta?", "a": "La alerta (nivel de vigilia); la orientación es contenido y está conservada en ese momento.", "h": "Orientado frente a alerta."}, {"q": "«Lúcido un minuto y luego somnoliento» describe el rasgo de {{fluctuación}}, que se reconoce sin establecer por sí solo un diagnóstico.", "a": "fluctuación", "h": "Caso: B1; CAM."}],
t4:[{"q": "Somnolencia: nivel de conciencia en el que la persona tiende a dormirse y se despierta con un {{estímulo verbal}}.", "a": "estímulo verbal", "h": "Nivel más leve de la escala después de la alerta."}, {"q": "¿Qué estructura hipotalámica funciona como reloj circadiano (proceso C) y se sincroniza con la luz de la retina?", "a": "El núcleo supraquiasmático.", "h": "Fija un ritmo de aproximadamente 24 horas."}, {"q": "Las neuronas de {{orexina (hipocretina)}} del hipotálamo lateral estabilizan la vigilia: si fallan, la persona oscila entre sueño y vigilia.", "a": "orexina (hipocretina)", "h": "Excitan los núcleos de vigilia."}, {"q": "Un paciente despierto y atento dice que se siente sin energía tras caminar poco. ¿Es somnolencia?", "a": "No; es fatiga. La somnolencia es tendencia a dormirse, no cansancio con el esfuerzo.", "h": "Fíjate si mantiene los ojos abiertos sin estímulo."}, {"q": "Ordena de mayor a menor nivel de conciencia: coma, alerta, estupor, somnolencia.", "a": "Alerta, somnolencia, estupor, coma.", "h": "Se ordenan por el estímulo que hace falta para despertar."}, {"q": "En el caso, el hijo dice que el paciente está lúcido y luego «somnoliento». ¿Qué dato necesita el examen para distinguir somnolencia de estupor?", "a": "El estímulo que lo despierta: el verbal indica somnolencia; solo uno vigoroso y repetido, estupor.", "h": "Conecta con B1."}],
t5:[{"q": "Estupor: solo despierta con estímulos {{vigorosos y repetidos}} y vuelve a dormirse al cesar.", "a": "vigorosos y repetidos", "h": "Grado entre somnolencia y coma."}, {"q": "¿Por qué vía asciende la señal dolorosa desde la médula hasta el tálamo?", "a": "Por la vía espinotalámica, tras cruzar la línea media en la médula.", "h": "Cordón anterolateral."}, {"q": "¿Qué respuesta motora al dolor indica mayor integración cortical: localizar o retirar?", "a": "Localizar, porque dirige la mano al estímulo; retirar es un reflejo sin integración.", "h": "Piensa en la mano cruzando la línea media."}, {"q": "¿Cómo se distingue el estupor del coma?", "a": "El estuporoso despierta, brevemente, con un estímulo vigoroso; el comatoso no despierta con ninguno.", "h": "Mira la apertura ocular tras el estímulo."}, {"q": "La escala de Glasgow evalúa tres componentes por separado. ¿Cuáles?", "a": "Apertura ocular, respuesta verbal y mejor respuesta motora.", "h": "No define estupor: define respuestas."}, {"q": "El hijo describe al paciente alternando lúcido y estuporoso en minutos. ¿Qué debe documentar el examen, según esta pestaña?", "a": "Estímulo usado y respuesta obtenida en cada momento, para ver cómo oscila el nivel.", "h": "Conecta con B1."}],
t6:[{"q": "Agitación psicomotora: actividad motora excesiva {{sin propósito}} impulsada por tensión interna.", "a": "sin propósito", "h": "Caminar de un lado a otro, retorcerse las manos."}, {"q": "¿Qué circuito frontosubcortical, al fallar, produce desinhibición?", "a": "El circuito orbitofrontal.", "h": "Inhibe impulsos y ajusta la conducta."}, {"q": "¿Qué falla si claudica el circuito del cingulado anterior?", "a": "La motivación: aparece apatía y la conducta no se inicia.", "h": "Es el circuito del propósito."}, {"q": "¿Qué separa la acatisia de la agitación?", "a": "La acatisia incluye una inquietud interna con urgencia de moverse que el paciente refiere, sobre todo por fármacos; la agitación puede ocurrir sin esa vivencia.", "h": "Pregunta al paciente qué siente."}, {"q": "¿Qué neurotransmisor del locus coeruleus, cuando se exagera su activación, aumenta la inquietud?", "a": "La noradrenalina.", "h": "Remisión a SARA, en «Lúcido»."}, {"q": "El hijo vio inquieto al paciente un día antes y luego caminando sin dirección por horas. ¿Qué dos términos de esta pestaña describen esas conductas?", "a": "Inquietud (o agitación) y deambulación errante.", "h": "Conecta con P1 y P2."}],
t7:[{"q": "El órgano vasculoso de la lámina terminal y el órgano subfornical carecen de barrera hematoencefálica completa. ¿Qué ventaja funcional les da y qué ponen en marcha?", "a": "Pueden medir directamente la osmolalidad y la angiotensina II de la sangre; activan la sed y la liberación de ADH.", "h": "Detectan la sangre sin filtro."}, {"q": "La ADH se une al receptor V2 del túbulo colector e inserta {{acuaporina-2}} en la membrana apical. ¿Qué cambia en la orina?", "a": "acuaporina-2: el agua se reabsorbe y la orina sale más concentrada y escasa.", "h": "Piensa en el canal de agua."}, {"q": "Una pérdida pequeña de agua eleva con rapidez la osmolalidad en un adulto mayor. ¿Qué tres cambios de la edad lo explican?", "a": "Menor agua corporal total (reserva), sed atenuada (hipodipsia) y menor capacidad renal de concentrar la orina.", "h": "Reserva, señal y riñón."}, {"q": "¿Qué es la polidipsia y por qué no equivale a tener sed aumentada?", "a": "Es la ingesta aumentada de líquidos; la sed aumentada puede existir sin que la persona logre beber más.", "h": "Una es la señal, otra es la conducta."}, {"q": "Una persona bebe mucho por hábito, sin estímulo osmótico ni de volumen. ¿Con qué término vecino se corresponde y en qué se separa de la sed por deshidratación?", "a": "Potomanía o polidipsia primaria: bebe sin que la sed responda a un déficit; en la deshidratación la sed sí sube con la osmolalidad.", "h": "Fíjate en qué dispara la sed."}, {"q": "En este paciente la sed aumenta pero toma menos agua para no orinar de noche. ¿Qué dato de sangre ayudaría a ver el efecto de esa restricción sobre la osmolalidad?", "a": "El sodio sérico y la osmolalidad plasmática: si la sed sube y no se repone el agua, la osmolalidad sigue subiendo.", "h": "Un dato de laboratorio."}],
t8:[{"q": "Durante el llenado vesical, ¿qué hace el detrusor y qué nervio mantiene cerrado el esfínter externo?", "a": "El detrusor se relaja y se acomoda sin subir mucho la presión; el nervio pudendo (somático) mantiene el esfínter externo contraído.", "h": "Relajación y control voluntario."}, {"q": "Si la acomodación del detrusor falla y la capacidad funcional de la vejiga baja, ¿qué patrón miccional aparece y con qué herramienta se registra?", "a": "Micciones frecuentes de poco volumen; se registra con el diario miccional.", "h": "Hora y volumen de cada micción."}, {"q": "De noche aumenta la {{ADH}}. ¿Qué efecto tiene sobre la diuresis nocturna y qué ocurre cuando se pierde ese ritmo?", "a": "ADH: la orina nocturna disminuye y se concentra; si se pierde, hay poliuria nocturna (exceso de orina en el sueño).", "h": "Ritmo circadiano de la orina."}, {"q": "¿Cómo define la ICS la nocturia como síntoma?", "a": "Despertarse una o más veces de noche para orinar, con cada micción precedida y seguida de sueño o de la intención de dormir.", "h": "No basta orinar de noche: debe despertar."}, {"q": "Una persona orina muchas veces de día, sin despertarse de noche. ¿Qué término describe eso y en qué se diferencia de la poliuria?", "a": "Polaquiuria, definida por la frecuencia diurna; la poliuria se define por el volumen de 24 horas.", "h": "Frecuencia frente a volumen."}, {"q": "En el caso, la frecuencia sube y el volumen por micción baja. ¿Qué medida separa polaquiuria, poliuria percibida y diuresis total baja?", "a": "La diuresis de 24 horas.", "h": "Un solo número lo resuelve."}],
t9:[{"q": "El reflejo rectoanal inhibitorio relaja el esfínter anal interno cuando las heces distienden el recto. ¿Qué esfínter queda bajo control voluntario y por qué nervio?", "a": "El esfínter anal externo, de músculo estriado, por el nervio pudendo.", "h": "Interno involuntario, externo voluntario."}, {"q": "Un colon lento da heces duras. ¿Qué proceso de la absorción lo explica?", "a": "Cuanto más tiempo permanece el contenido, más agua se absorbe en el colon y más duras salen las heces.", "h": "El tiempo seca."}, {"q": "El colon avanza bien, pero la persona puja y no logra expulsar las heces. ¿Qué trastorno se sospecha y qué falla?", "a": "Disinergia defecatoria: el piso pélvico o el esfínter no se relajan al pujar.", "h": "Falla la expulsión, no el tránsito."}, {"q": "¿Qué mide la escala de Bristol y cómo se relaciona con el tránsito?", "a": "La forma de las heces en siete tipos; se correlaciona con el tiempo de tránsito intestinal total (heces duras, tránsito lento).", "h": "Forma frente a tiempo."}, {"q": "Un paciente con dolor cólico, distensión, vómitos y sin paso de heces ni gases. ¿Por qué no es solo estreñimiento?", "a": "Sugiere obstrucción intestinal, una barrera mecánica que detiene el tránsito y es una urgencia.", "h": "No es un hábito lento."}, {"q": "En el caso, ¿qué cuatro grupos de causas secundarias obligan a descartar antes de llamar funcional al estreñimiento?", "a": "Metabólica, farmacológica, neurológica y obstructiva.", "h": "Funcional es diagnóstico de exclusión clínica."}],
pb:[{"q": "Un cerebro vulnerable más un insulto sistémico produce disfunción de la red {{atencional}} y del SARA.", "a": "atencional", "h": "Mecanismo de B1."}, {"q": "¿Qué tres mecanismos pueden explicar polaquiuria con poco volumen en este paciente?", "a": "Diuresis osmótica por glucosa, resistencia renal a la ADH por calcio elevado y caída del filtrado por deshidratación.", "h": "B2; los separa la diuresis de 24 horas."}, {"q": "En B3, la pérdida de agua libre con reposición insuficiente eleva la {{osmolaridad}} plasmática y deshidrata las {{neuronas}}.", "a": "osmolaridad; neuronas", "h": "Déficit de agua libre."}, {"q": "¿Por qué la restricción voluntaria de agua (P3) agrava el cuadro?", "a": "Porque la causa de la poliuria persiste: orina igual y bebe menos, así que el déficit de agua crece.", "h": "Círculo vicioso del agua."}, {"q": "¿Por qué el estreñimiento (B4) puede ser pista de un proceso metabólico y no solo un hábito?", "a": "Porque las alteraciones metabólicas y la deshidratación reducen la motilidad y endurecen las heces.", "h": "Hipomotilidad más agua colónica."}, {"q": "¿Cómo se diferencia un factor de riesgo (FR) de un problema B, P o S?", "a": "El FR no es un problema a resolver sino un argumento que predispone o precipita el cuadro.", "h": "Ejes de la pestaña."}, {"q": "Fatiga de meses, sed y estreñimiento de semanas (FR4) sugieren un proceso de {{fondo}} que precede al cuadro agudo.", "a": "fondo", "h": "Síntomas subagudos como pista."}],
jq:[{"q": "¿Por qué B1 (alteración aguda de la conciencia) va antes que B2 (nocturia con poco volumen)?", "a": "B1 es una amenaza vital tiempo-dependiente; B2 solo orienta la causa y no mata por sí misma.", "h": "Criterio: amenaza vital inmediata."}, {"q": "¿Por qué B3 (sed con ingesta reducida) comparte el nivel g1 con B1?", "a": "Puede ser causa y agravante: la deshidratación hipertónica daña el sistema nervioso y el riñón y se corrige mejor si es temprana.", "h": "Tiempo-dependencia y reversibilidad."}, {"q": "¿Por qué P2 (deambulación por horas) va antes que P1 (inquietud previa)?", "a": "P2 expone a agotamiento o golpe de calor, caídas y extravío; P1 solo fija el inicio y el curso.", "h": "Riesgo de daño."}, {"q": "¿Por qué S2 (sin posibilidad de derivar) va en g2 aunque no es un problema del paciente?", "a": "Modula el riesgo: todo estudio y vigilancia inicial se resuelve en el centro de salud, lo que eleva el peso de B1 y B3.", "h": "Impacto en la respuesta del sistema."}, {"q": "¿Por qué S3 (historia que depende de un informante) es el último, en g4?", "a": "No daña al paciente y se corrige verificando los datos con el hijo y otros contactos.", "h": "Bajo en los cuatro criterios."}],
hx:[{"q": "Método CAM para delirium: ¿qué dos rasgos deben estar presentes siempre?", "a": "Inicio agudo con curso fluctuante, e inatención.", "h": "Se añade pensamiento desorganizado o conciencia alterada."}, {"q": "CAM: además de inicio agudo e inatención, ¿qué rasgo adicional se necesita (uno de dos)?", "a": "Pensamiento desorganizado o alteración del nivel de conciencia.", "h": "Inouye 1990."}, {"q": "Hipernatremia: ¿por encima de qué sodio sérico se define en adultos?", "a": "145 mmol/L", "h": "Refleja hiperosmolalidad sérica."}, {"q": "¿Qué dos rasgos clínicos definen el golpe de calor, más allá de la exposición al calor?", "a": "Disfunción del sistema nervioso central e hipertermia extrema (por lo general sobre 40,5 °C).", "h": "Epstein 2019."}, {"q": "Hipercalcemia: ¿qué prueba hormonal distingue las causas dependientes de las no dependientes de PTH?", "a": "La PTH intacta sérica.", "h": "Walker 2022."}, {"q": "Estado hiperosmolar hiperglucémico: ¿qué debe estar ausente, a diferencia de la cetoacidosis?", "a": "Cetonemia grave y acidosis metabólica (la mayoría tiene pH de 7,30 o más y bicarbonato de 18 mmol/L o más).", "h": "Consenso ADA 2024."}, {"q": "En este caso, ¿qué dato separa la hipótesis hipercalcemia de la de estado hiperosmolar hiperglucémico?", "a": "El calcio corregido o iónico frente a la glucemia y la osmolalidad; el caso no trae ninguno.", "h": "Datos faltantes."}]
};
DECKS.tg=[].concat.apply([],Object.keys(TERMS).map(function(k){return DECKS[k].map(function(c){return {q:c.q,a:c.a,h:c.h,t:k};});}));
const RC={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(k,s){return document.getElementById('rc-'+k+'-'+s);}
function isCloze(c){return c.q.indexOf('{{')>=0;}
function front(c){return esc(c.q).replace(/\{\{[^}]*\}\}/g,'[ ? ]');}
function back(c){return esc(c.q).replace(/\{\{([^}]*)\}\}/g,'<b>$1</b>');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function show(id,btn){
  document.querySelectorAll('.tab').forEach(function(s){s.classList.toggle('active',s.id===id);});
  document.querySelectorAll('.tb').forEach(function(b){b.classList.toggle('active',b===btn);});
  try{btn.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
}
function tog(b){b.parentElement.classList.toggle('op');}
function rc_reset(k){
  var n=DECKS[k].length,idx=[];
  for(var i=0;i<n;i++)idx.push(i);
  RC[k]={queue:shuffle(idx),first:{},fails:{},shown:false,done:0,n:n};
  if(el(k,'e'))el(k,'e').innerHTML='';
  rc_render(k);
}
function rc_render(k){
  var s=RC[k],card=el(k,'c');
  if(!card)return;
  if(!s.queue.length){rc_end(k);return;}
  var c=DECKS[k][s.queue[0]],f=s.fails[s.queue[0]]||0;
  el(k,'n').textContent='Tarjeta '+(s.done+1)+' de '+s.n+(k==='tg'&&s.shown?' · '+TERMS[c.t]:'');
  var h='<p class="rc-q">'+(s.shown&&isCloze(c)?back(c):front(c))+'</p>';
  if(s.shown&&!isCloze(c))h+='<p class="rc-a"><b>Respuesta.</b> '+esc(c.a)+'</p>';
  if(!s.shown&&f>=2)h+='<p class="rc-hint">Pista: '+esc(c.h)+'</p>';
  card.innerHTML=h;
  var b='';
  if(!s.shown){b+='<button class="go" onclick="rc_show(\''+k+'\')">Mostrar respuesta</button>';}
  else{
    b+='<button class="gr ok" onclick="rc_grade(\''+k+'\',\'ok\')">La sabía</button>';
    b+='<button class="gr mid" onclick="rc_grade(\''+k+'\',\'mid\')">A medias</button>';
    b+='<button class="gr ko" onclick="rc_grade(\''+k+'\',\'ko\')">No la sabía</button>';
  }
  b+='<button class="ghost" onclick="rc_reset(\''+k+'\')">Reiniciar mazo</button>';
  el(k,'b').innerHTML=b;
}
function rc_show(k){RC[k].shown=true;rc_render(k);}
function rc_grade(k,g){
  var s=RC[k],i=s.queue.shift();
  if(s.first[i]===undefined)s.first[i]=(g==='ok');
  if(g==='ok'){s.done++;}
  else{s.fails[i]=(s.fails[i]||0)+1;s.queue.push(i);}
  s.shown=false;
  rc_render(k);
}
function rc_verdict(p){return p>=80?['ok','Término consolidado']:['rep','Repasar hoy'];}
function rc_end(k){
  var s=RC[k],ok=0,i,rows='';
  for(i=0;i<s.n;i++)if(s.first[i])ok++;
  var p=Math.round(100*ok/s.n),v=rc_verdict(p);
  el(k,'n').textContent='Mazo completado';
  el(k,'c').innerHTML='<p class="rc-q">Cola agotada: todas las tarjetas se resolvieron.</p>';
  el(k,'b').innerHTML='<button class="ghost" onclick="rc_reset(\''+k+'\')">Reiniciar mazo</button>';
  var h='<div class="rc-end '+v[0]+'">Aciertos al primer intento: '+ok+' de '+s.n+' ('+p+' %). <b>'+v[1]+'</b>.</div>';
  if(k==='tg'){
    Object.keys(TERMS).forEach(function(t){
      var tot=0,hit=0;
      for(i=0;i<s.n;i++){if(DECKS.tg[i].t===t){tot++;if(s.first[i])hit++;}}
      var pp=Math.round(100*hit/tot),vv=rc_verdict(pp);
      rows+='<tr><td>'+esc(TERMS[t])+'</td><td>'+hit+' de '+tot+' ('+pp+' %)</td><td>'+vv[1]+'</td></tr>';
    });
    h+='<div class="tw"><table><thead><tr><th>Término</th><th>Aciertos 1er intento</th><th>Veredicto</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  el(k,'e').innerHTML=h;
}
Object.keys(DECKS).forEach(rc_reset);
</script>
</div></body></html>
