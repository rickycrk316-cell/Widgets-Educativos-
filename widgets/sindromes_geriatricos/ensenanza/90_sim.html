<script>

(function(){
function dcE1tx(dc){

  var n=lista.length;
  if(h(a,'ning')&&n>0){
    x.push(p('Marcaste «ninguna» junto con ABVD que necesitan ayuda: corrige la selección para poder contar el declive [51].'));
    out(dc,x.join(''));return;
  }
  if(n>0){
    x.push(p('<b>Necesita ayuda en '+n+' de las 5 ABVD</b> (bañarse, vestirse, comer, trasladarse y usar el retrete) [51].'));
    if(h(b,'aut')) x.push(p('Era autónomo dos semanas antes del ingreso: es un <b>declive funcional asociado a la hospitalización</b> y es potencialmente reversible. De elección: movilización precoz y rehabilitación progresiva con fisioterapia y terapia ocupacional; mide de nuevo las ABVD con la misma escala antes del alta [18][49].'));
    else if(h(b,'dep')) x.push(p('Ya dependía antes del ingreso: no hay declive nuevo que atribuir a la hospitalización, pero el reposo puede agravar lo que tenía. Mantén la movilización y compara con el basal previo [51].'));
    else x.push(p('Falta el basal previo: sin la función de las dos semanas anteriores no puedes decir si es un declive nuevo [51].'));
  } else if(h(a,'ning')){
    x.push(p('Sin ayuda en ninguna ABVD: no hay pérdida de función básica ahora. Valora las actividades instrumentales con la escala de Lawton y mantén la movilidad para prevenir el declive [42][18].'));
  }
  if(h(m,'rest')){
    if(h(c,'sang')||h(c,'hit')){
      x.push(p('Movilidad muy restringida, pero con '+(h(c,'sang')&&h(c,'hit')?'sangrado mayor activo y antecedente reciente de trombocitopenia por heparina':(h(c,'sang')?'sangrado mayor activo':'trombocitopenia inmune por heparina en los últimos 100 días'))+': la enoxaparina está contraindicada según su ficha técnica. No la indiques y consulta con el especialista la alternativa de profilaxis [56].'));
    } else if(h(c,'renal')){
      x.push(p('Movilidad muy restringida durante la enfermedad aguda, sin contraindicación y con depuración de creatinina menor de 30 mL/min: <b>enoxaparina 30 mg SC cada 24 h</b>, por una duración usual de 6 a 11 días [56]. La dosis de 40 mg disminuyó la tromboembolia venosa frente a placebo en pacientes médicos agudos [55].'));
    } else {
      x.push(p('Movilidad muy restringida durante la enfermedad aguda y sin contraindicación: <b>enoxaparina 40 mg SC cada 24 h</b>, por una duración usual de 6 a 11 días [56]. Con 40 mg la tromboembolia venosa fue de 5,5 % frente a 14,9 % con placebo; 20 mg no mostró diferencia [55].'));
    }
  } else if(h(m,'lib')){
    x.push(p('Camina con ayuda: la prioridad es aumentar la movilización diaria y no volver al reposo; la indicación de enoxaparina del estudio y de la ficha se refiere a movilidad muy restringida [55][56].'));
  } else if(h(c,'renal')||h(c,'sang')||h(c,'hit')){
    x.push(p('Marcaste una situación para la enoxaparina sin definir la movilidad: la profilaxis se considera solo si la movilidad está muy restringida durante la enfermedad aguda [56].'));
  }
  if(h(s,'ok')) x.push(p('Piel sin lesión: continúa la inspección de sacro, talones y caderas en cada turno y el reposicionamiento; repite Braden o Norton si cambia la movilidad [31][5].'));
  else if(s.length){
    x.push(p('Hay una lesión de piel en estadio '+s[0].charAt(1)+': retira la presión del sitio con reposicionamiento y superficies de apoyo; el estadio y la curación se manejan en «Úlceras por presión» [13][5].'));
  }
  x.push('<span class="cf">Si recupera el traslado y el retrete y vuelve a su basal → pasa de rehabilitación activa a mantener la movilidad y el control en consulta externa [51]; si aparece sangrado mayor activo → se retira la enoxaparina [56].</span>');
  out(dc,x.join(''));

window.dcE1tx=dcE1tx;
})();
(function(){
function dcE2tx(dc){
  var p=function(t){return '<p>'+t+'</p>';};
  var h=function(a,v){return a.indexOf(v)>-1;};
  var c=sel(dc,'cai'),ev=sel(dc,'ev'),st=sel(dc,'sit'),tug=num(dc,'tug');
  if(!c.length&&!ev.length&&!st.length&&isNaN(tug)){
    out(dc,p('Elige las caídas del último año, el TUG o los hallazgos de gravedad y la situación. El simulador estratifica el riesgo según las guías mundiales y propone la conducta con su posología; no calcula probabilidades.'));return;}
  var r=[];
  var marcha=(!isNaN(tug)&&tug>15)||h(ev,'vel');
  var grave=h(ev,'lesion')||h(ev,'fra')||h(ev,'suelo')||h(ev,'loc');
  var alto=h(c,'rec')||(grave&&!h(c,'cero'));
  var nivel;
  if(alto) nivel='alto';
  else if(h(c,'una')&&marcha) nivel='intermedio';
  else nivel='bajo';
  if(!c.length&&!grave){
    r.push(p('Falta la historia de caídas: la clasificación de las guías parte de ella. Pregunta por las caídas de los últimos 12 meses y su gravedad [9].'));
  } else if(nivel==='alto'){
    r.push(p('<b>Riesgo alto</b>: '+(h(c,'rec')?'dos o más caídas en 12 meses':'caída con criterio de gravedad')+' [9]. Conducta: evaluación multifactorial (marcha y equilibrio, presión supina y de pie con electrocardiograma, cognición, visión, fármacos, entorno, calzado y miedo a caer) y plan multidominio personalizado [9].'));
  } else if(nivel==='intermedio'){
    r.push(p('<b>Riesgo intermedio</b>: una caída no grave con alteración de la marcha (TUG mayor de 15 s o velocidad menor de 0,8 m/s) [9]. Conducta: ejercicio de fuerza y equilibrio [9].'));
  } else {
    r.push(p('<b>Riesgo bajo</b>: '+(h(c,'cero')?'sin caídas':'una caída no grave sin alteración de la marcha')+' [9]. Conducta: prevención primaria y reevaluación cada año [9]. El riesgo bajo no es riesgo nulo [9].'));
    if(h(c,'cero')&&marcha) r.push(p('La marcha lenta no cambia el nivel sin caídas, pero justifica ofrecer ejercicio de equilibrio, que las guías recomiendan a todos los mayores [9].'));
  }
  var ex='ejercicio de equilibrio y funcionales (sentarse y pararse, pasos), individualizado y progresivo, tres o más sesiones por semana durante al menos 12 semanas y continuado [9]';
  if(nivel!=='bajo'||h(c,'cero')) r.push(p('<b>Ejercicio</b>: '+ex+'.'));
  if(nivel!=='bajo') r.push(p('<b>Hogar</b>: visita con modificación del entorno, mejor por terapia ocupacional [63][9].'));
  if(h(ev,'loc')) r.push(p('<b>Pérdida de conciencia sospechada</b>: estudia el síncope según la guía local; no basta la prevención de caídas [9].'));
  if(h(ev,'suelo')) r.push(p('<b>Más de una hora en el suelo</b>: busca deshidratación, alteración de electrolitos, falla renal y rabdomiólisis, que se asocian con la larga permanencia [9].'));
  if(h(st,'frid')) r.push(p('<b>Fármacos sedantes</b>: revisión estructurada (STOPPFall) con deprescripción; los opioides débiles como el tramadol conviene evitarlos si es posible, porque aumentan el riesgo de caídas [9][65].'));
  if(h(st,'vitd')) r.push(p('<b>Vitamina D</b>: solo por riesgo de déficit, dosis diaria VO cada 24 h según las guías nacionales de nutrición; no se da a todos para prevenir caídas [9][63].'));
  if(h(st,'cad')){
    if(h(st,'fg35')) r.push(p('<b>Fractura de cadera reciente con depuración menor de 35 mL/min</b>: el ácido zoledrónico está contraindicado [68]. Deriva a quien maneje la osteoporosis; mantén ejercicio individualizado iniciado en el hospital [9].'));
    else r.push(p('<b>Fractura de cadera reciente</b>: ácido zoledrónico 5 mg IV en no menos de 15 minutos, una vez al año; primera infusión dentro de 90 días de la reparación [66][68]. Corrige antes la hipocalcemia y asegura calcio (al menos 1 200 mg) y vitamina D (800–1 000 UI) diarios si la ingesta es insuficiente [68]. Mantén ejercicio individualizado iniciado en el hospital [9].'));
  } else if(h(st,'fg35')) r.push(p('<b>Función renal baja</b>: recuerda que el ácido zoledrónico está contraindicado con depuración menor de 35 mL/min si luego surge una fractura [68].'));
  r.push('<span class="cf">Si hay una sola caída sin lesión y el TUG pasa de 15 s o menos a más de 15 s → el riesgo sube de bajo a intermedio y se añade ejercicio supervisado; si hay pérdida de conciencia → piensa en síncope [9].</span>');
  out(dc,r.join(''));
}

window.dcE2tx=dcE2tx;
})();
(function(){
function dcE3tx(dc){
  function p(t){return '<p>'+t+'</p>';}
  function h(a,v){return a.indexOf(v)>-1;}
  var t=sel(dc,'tipo'),f=sel(dc,'fact'),r=sel(dc,'rpm'),c=sel(dc,'ctx');
  if(!(t.length||f.length||r.length||c.length)){
    out(dc,p('Marca el tipo de incontinencia, los factores transitorios, el residuo posmiccional y las situaciones que cambian el fármaco. El simulador propone el orden de conducta y el fármaco con su posología; no calcula probabilidades.'));return;}
  var x=[];
  if(f.length){
    var m=[];
    if(h(f,'ivu')) m.push('trata la infección urinaria sintomática');
    if(h(f,'del')) m.push('trata el delirium y su causa');
    if(h(f,'imp')) m.push('desimpacta las heces y regula el tránsito intestinal');
    if(h(f,'glu')) m.push('mejora el control glucémico, que reduce la poliuria');
    if(h(f,'furo')) m.push('revisa con el médico tratante el horario y la necesidad de la furosemida');
    if(h(f,'mov')) m.push('moviliza y acerca el retrete o un orinal');
    x.push(p('<b>Primero lo transitorio (DIAPPERS)</b>: '+m.join('; ')+' [5].'));
  }
  if(!t.length){
    x.push(p('Falta el tipo: sin definirlo con la historia, el examen y el diario miccional no se elige el tratamiento [69][5].'));
  } else {
    var k=t[0];
    if(h(r,'alto')||k==='reb'){
      x.push(p('<b>Residuo posmiccional alto o rebosamiento</b>: busca obstrucción, impactación fecal o un fármaco causal y deriva; no indiques un antimuscarínico, que empeora el vaciado [5][73].'));
    } else if(k==='urg'||k==='mix'){
      x.push(p('<b>'+(k==='urg'?'Urgencia':'Mixta')+'</b>: de elección, tratamiento conductual (entrenamiento vesical y ejercicios del suelo pélvico) [69][70].'));
      if(k==='mix') x.push(p('En la mixta, los ejercicios de suelo pélvico también atienden el componente de esfuerzo [70].'));
      if(h(c,'cog')) x.push(p('Con deterioro cognitivo o delirium previo, evita los antimuscarínicos fuertemente anticolinérgicos [12]; si hace falta fármaco, prefiere un agonista β3 [77].'));
      else x.push(p('Si la conducta no basta, se prefiere un agonista β3 al antimuscarínico en el anciano [12][77].'));
      if(h(c,'hta')) x.push(p('Hipertensión grave no controlada (180/110 mm Hg o más): el mirabegrón no se recomienda; el vibegrón 75 mg VO cada 24 h es la opción de la tabla [73][75].'));
      else if(h(c,'renal')) x.push(p('eGFR 15 a 29: <b>mirabegrón 25 mg VO cada 24 h</b> como máximo [73], o vibegrón 75 mg VO cada 24 h, que no requiere ajuste con eGFR de 15 a menos de 90 [75].'));
      else if(h(c,'hep')) x.push(p('Child-Pugh B: <b>mirabegrón 25 mg VO cada 24 h</b> como máximo [73]; el vibegrón 75 mg VO cada 24 h no requiere ajuste [75].'));
      else x.push(p('<b>Mirabegrón 25 mg VO cada 24 h</b>, hasta 50 mg a las 4 a 8 semanas, con control periódico de la presión arterial [73]; alternativa, <b>vibegrón 75 mg VO cada 24 h</b> [75].'));
    } else if(k==='esf'){
      x.push(p('<b>Esfuerzo</b>: de elección, ejercicios del suelo pélvico, que redujeron la incontinencia en los ensayos en mujeres [70]. Los fármacos de esta pestaña son para la urgencia y no tratan el esfuerzo [69].'));
    } else if(k==='fun'){
      x.push(p('<b>Funcional</b>: el tracto está sano; trata la movilidad, adapta el acceso al retrete y programa la micción a horas fijas, con ayuda si hace falta [5][76].'));
      if(h(c,'cog')) x.push(p('Con deterioro cognitivo, la micción con recordatorio o ayuda es la base; evita sumar un antimuscarínico fuerte [12].'));
    }
  }
  x.push('<span class="cf">Si tras 4 a 8 semanas el diario miccional no mejora → repite el residuo posmiccional y revisa el diagnóstico de tipo [69]; si aparece retención o sangre en la orina → suspende el fármaco y busca causa orgánica [5][73].</span>');
  out(dc,x.join(''));
}

window.dcE3tx=dcE3tx;
})();
(function(){
function dcE4tx(dc){
  function p(t){return '<p>'+t+'</p>';}
  function h(a,v){return a.indexOf(v)>-1;}
  var ini=sel(dc,'ini'),at=sel(dc,'atn'),cam=sel(dc,'cam'),fu=sel(dc,'fun'),cx=sel(dc,'ctx'),m=num(dc,'mmse');
  if(!(ini.length||at.length||cam.length||fu.length||cx.length||!isNaN(m))){
    out(dc,p('Marca el inicio, la atención, los rasgos adicionales de la CAM, la función diaria, el MMSE y la situación. El simulador propone si es delirium, deterioro cognitivo leve o demencia, y el manejo inicial con su posología; no calcula probabilidades.'));return;}
  var x=[];
  var agudo=h(ini,'agudo'),inat=h(at,'alt'),c34=h(cam,'pens')||h(cam,'conc');
  var dem=h(cx,'prev'),agit=h(cx,'agit'),brad=h(cx,'brad'),iche=h(cx,'iche'),ren=h(cx,'renal');
  if(h(ini,'agudo')&&h(ini,'insid')){out(dc,p('Marcaste inicio agudo e insidioso a la vez: elige uno.'));return;}
  var DON='donepezilo 5 mg VO cada 24 h por la noche; 10 mg solo tras 4 a 6 semanas con 5 mg [97]';
  var RIV='rivastigmina 1,5 mg VO cada 12 h con comida, con subidas de al menos 2 semanas (máximo 12 mg al día) [98]';
  var GAL='galantamina 4 mg VO cada 12 h con comida; 8 mg tras al menos 4 semanas [99]';
  var MEM='memantina 5 mg VO cada 24 h; sube 5 mg por semana hasta 10 mg por toma (20 mg al día)'+(ren?'; con depuración de creatinina de 5 a 29 mL/min, objetivo 5 mg cada 12 h':'')+' [100]';
  if(agudo){
    if(!at.length){x.push(p('Falta la atención: sin ella no puedes aplicar el algoritmo de la CAM [29].'));}
    else if(inat&&c34){
      x.push(p('<b>Cumple el algoritmo de la CAM</b> (inicio agudo y fluctuante, inatención y pensamiento desorganizado o conciencia alterada): es <b>delirium</b> hasta demostrar lo contrario [29][3]. No es una demencia ni un deterioro leve: no se rotula hasta que se resuelva el cuadro [78].'));
    } else if(inat){
      x.push(p('Inicio agudo con inatención, pero falta pensamiento desorganizado o conciencia alterada: la CAM no se completa. Aplica el 4AT, que se recomienda ante la sospecha de delirium, y no descartes el hipoactivo [79][81].'));
    } else {
      x.push(p('Con atención conservada el delirium es poco probable según la CAM; busca otra causa del cambio agudo y repite la valoración si fluctúa [29].'));
    }
    if(inat){
      x.push(p('<b>De elección</b>: busca y corrige la causa (infección, deshidratación, trastorno metabólico, fármacos) y aplica medidas multicomponente: orientación, hidratación, sueño, movilización, gafas y audífonos y acompañamiento [3][87][96].'));
      if(dem) x.push(p('Había deterioro previo de meses o años: es <b>delirium sobre demencia</b>; no atribuyas el cambio agudo a la demencia y reevalúa la cognición basal al resolverse [3][88].'));
      if(h(cx,'tram')) x.push(p('Toma tramadol y pregabalina: revisa ambos como posibles precipitantes; la Beers 2023 señala evitar los opioides en el delirium [12].'));
      if(agit) x.push(p('Hay riesgo para sí o para otros o angustia grave que no cede con medidas verbales: antipsicótico a dosis baja, por una semana o menos; <b>haloperidol 0,5 a 2 mg VO cada 8 a 12 h</b>, empezando por 0,5 mg [81][101]. Sabe que no acorta el delirium [84].'));
      else x.push(p('Sin riesgo ni angustia grave no se indica antipsicótico de rutina; no uses benzodiacepinas salvo abstinencia alcohólica o de sedantes [81][12].'));
    }
  } else if(h(ini,'insid')){
    var ind=h(fu,'ind'),depn=h(fu,'dep');
    if(!fu.length) x.push(p('Falta la función diaria con un informante: es lo que separa el deterioro cognitivo leve de la demencia [78].'));
    else if(ind){
      x.push(p('Declive de meses con independencia conservada: <b>trastorno neurocognitivo leve (deterioro cognitivo leve)</b> [78]. No hay tratamiento farmacológico con evidencia de calidad; retira fármacos que alteran la cognición, recomienda ejercicio (6 meses) y reevalúa en el tiempo: 14,9 % desarrolló demencia en 2 años [82].'));
    } else if(depn){
      x.push(p('Declive de meses con pérdida de independencia: <b>demencia (trastorno neurocognitivo mayor)</b> si el delirium se ha descartado [78][80]. Pide B12 y TSH, tamiza depresión y haz neuroimagen estructural [80][85].'));
    }
    if(!isNaN(m)){
      if(m<0||m>30) x.push(p('El MMSE va de 0 a 30: revisa el puntaje [93].'));
      else {
        var est=m>=21?'leve':(m>=11?'moderada':'grave');
        if(m>=26) x.push(p('MMSE de '+m+': el MMSE detecta poco el deterioro leve y lo influye la escolaridad; completa con MoCA [89][30].'));
        else x.push(p('MMSE de '+m+': si hay demencia, estadio '+est+' (21 a 25 leve, 11 a 20 moderada, 0 a 10 grave) [93]. Ajusta a la escolaridad: la mediana fue 22 con 0 a 4 años de estudio [30].'));
        if(depn&&m<26){
          if(brad) x.push(p('Bradicardia, bloqueo o síncope: el colinesterásico tiene efecto vagotónico; obtén un ECG y consulta antes de indicarlo. En la fase moderada o grave la alternativa es memantina: '+MEM+' [97][80].'));
          else if(est==='leve'||est==='moderada'){
            x.push(p('Demencia '+est+': inhibidor de colinesterasa. Opciones: '+DON+'; o '+RIV+'; o '+GAL+' [80].'+(iche&&est==='moderada'?' Ya lo toma: continúa y considera añadir memantina: '+MEM+' [80].':'')));
          } else x.push(p('Demencia grave: memantina '+(iche?'añadida al inhibidor que ya toma: ':'en monoterapia: ')+MEM+' [80].'));
        }
      }
    }
    if(h(cx,'tram')) x.push(p('Toma tramadol y pregabalina: revisa su necesidad como fármacos de acción central que pueden alterar la cognición [12].'));
  }
  if(agit&&!agudo) x.push(p('Agitación en demencia: busca primero dolor, delirium y causas del entorno; antipsicótico solo con riesgo o angustia grave [80].'));
  x.push('<span class="cf">Si el cambio fuera de inicio agudo con inatención → delirium: causa y medidas no farmacológicas primero; si la independencia se perdiera en un declive de meses → demencia, y recién entonces un inhibidor de colinesterasa [29][80].</span>');
  out(dc,x.join(''));
}

window.dcE4tx=dcE4tx;
})();
(function(){

  if(e.length&&e[0]==='tp') x.push(p('Tejido profundo con piel intacta: descarga estricta y vigilancia de la evolución, porque el daño puede abrirse o ser más profundo de lo que parece [13].'));
