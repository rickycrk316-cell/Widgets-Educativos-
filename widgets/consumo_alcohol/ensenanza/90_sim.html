<script>
function par(t){return '<p>'+t+'</p>';}
function hv(a,v){return a.indexOf(v)>-1;}
function vacio(dc,t){out(dc,par(t));}
function dcF(x){return String(x).replace('.',',');}

function dcDx(dc){
  var au=sel(dc,'au'),dm=sel(dc,'dm'),ab=sel(dc,'ab'),al=sel(dc,'al'),r=[];
  if(!au.length&&!dm.length){vacio(dc,'Elige la banda del AUDIT y el número de criterios DSM-5-TR para obtener la clasificación y la conducta.');return;}
  if(!au.length||!dm.length){vacio(dc,'Faltan datos: la clasificación necesita la banda del AUDIT y el número de criterios DSM-5-TR [15][1].');return;}
  var a=au[0],n=parseInt(dm[0],10),cl,cd;
  if(n>=2){
    var gr=n>=6?'grave':(n>=4?'moderado':'leve');
    cl='<b>Trastorno por consumo de alcohol '+gr+'</b> ('+(n>=6?'6 o más':(n>=4?'4 o 5':'2 o 3'))+' criterios DSM-5-TR) [1]';
    cd='Meta de abstinencia o reducción del daño pactada con el paciente, fármaco para prevenir recaídas tras la desintoxicación y apoyo psicosocial (ver «Plan de tratamiento»)'+(n>=6?'; deriva a especialista [16][17].':' [17].');
    if(a==='b') r.push(par('Discordancia: el AUDIT bajo no concuerda con los criterios; prima el DSM-5-TR. Reinterroga el consumo, porque el AUDIT subestima si el paciente minimiza [15].'));
  } else if(a==='d'){
    cl='<b>Probable dependencia</b> por AUDIT de 20 o más, sin confirmar con criterios DSM-5-TR [15]';
    cd='Interroga los 11 criterios para confirmar y graduar, valora abstinencia y deriva para evaluación diagnóstica [15][1].';
  } else if(a==='p'){
    cl='<b>Consumo perjudicial</b> (AUDIT de 16 a 19) sin criterios suficientes de trastorno [15][2]';
    cd='Consejo simple, asesoría breve con entrevista motivacional y seguimiento; meta de bajo riesgo o abstinencia según el daño [15][16].';
  } else if(a==='r'){
    cl='<b>Consumo de riesgo</b> (AUDIT de 8 a 15) [15]';
    cd='Intervención breve con consejo simple y seguimiento; meta de consumo de bajo riesgo [15][16].';
  } else {
    cl='<b>Consumo de bajo riesgo</b> (AUDIT de 0 a 7) [15]';
    cd='Educación sobre el alcohol; repite el tamizaje en la siguiente consulta [15].';
  }
  r.push(par('Clasificación: '+cl+'.'));
  r.push(par('Conducta: '+cd));
  if(ab.length&&ab[0]==='si') r.push(par('Signos de abstinencia: mide la gravedad con CIWA-Ar y trata según el resultado (ver «Plan de tratamiento»); la abstinencia indica neuroadaptación, así que reclasifica como dependencia aunque el AUDIT sea bajo [14][12].'));
  if(ab.length&&ab[0]==='gr') r.push(par('<b>Abstinencia complicada</b> (convulsión, alucinaciones o delirium): hospitalización urgente, tiamina parenteral y benzodiacepina intravenosa; descarta Wernicke, hipoglucemia y trauma [12].'));
  if(hv(al,'wer')) r.push(par('Alarma, Wernicke: confusión, ataxia u oftalmoplejía; tiamina parenteral antes de cualquier glucosa (ver «Plan de tratamiento») [13].'));
  if(hv(al,'glu')) r.push(par('Alarma, hipoglucemia: glucemia capilar, glucosa intravenosa con tiamina previa o simultánea si hay desnutrición [13].'));
  if(hv(al,'tce')) r.push(par('Alarma, trauma craneal: la intoxicación enmascara el examen neurológico; pide tomografía de cráneo ante cualquier deterioro o signo focal [13].'));
  if(hv(al,'met')) r.push(par('Alarma, metanol: visión borrosa con acidosis; pide gasometría, brecha osmolar y valoración toxicológica urgente [13].'));
  r.push('<span class="cf">Si los criterios DSM-5-TR pasan de 0 o 1 a 4 o 5 con el mismo AUDIT → de consumo perjudicial o de riesgo a trastorno moderado, con abstinencia por vigilar y fármaco para prevenir recaídas [1].</span>');
  out(dc,r.join(''));
}

function dcTx(dc){
  var pt=sel(dc,'pt'),ab=sel(dc,'ab'),hp=sel(dc,'hp'),nu=sel(dc,'nu'),kg=num(dc,'kg'),r=[];
  if(!pt.length){vacio(dc,'Elige el patrón, la abstinencia y las condiciones del paciente para obtener el plan con posología.');return;}
  if(!ab.length||!hp.length){vacio(dc,'Faltan datos: el plan necesita la gravedad de la abstinencia por CIWA-Ar y si hay hepatopatía [12].');return;}
  var p=pt[0],a=ab[0],h=hp[0]==='si',wer=hv(nu,'wer'),des=hv(nu,'des'),hosp=false;
  var peso=!isNaN(kg)&&kg>=30&&kg<=200;
  if(p!=='d'&&a!=='no') r.push(par('Una abstinencia indica neuroadaptación: reclasifica como dependencia y sigue ese plan [12].'));
  if(p==='r') r.push(par('<b>Intervención breve</b> (FRAMES) y seguimiento; meta de consumo de bajo riesgo. Sin fármacos [16][17].'));
  if(p==='p') r.push(par('<b>Intervención breve y entrevista motivacional</b>; meta de bajo riesgo o abstinencia según el daño. Sin fármacos en el primer nivel salvo que aparezca dependencia [16][17].'));
  if(p==='d'||a!=='no'){
    if(a==='gr'||wer||(a==='mo'&&h)) hosp=true;
    if(hosp) r.push(par('<b>Manejo hospitalario</b>: '+(wer?'sospecha de Wernicke; ':'')+(a==='gr'?'abstinencia grave; ':'')+(a==='mo'&&h?'abstinencia moderada con hepatopatía; ':'')+'vigilancia continua y CIWA-Ar frecuente [12].'));
    else if(a==='mo') r.push(par('Abstinencia moderada: el manejo ambulatorio solo es posible con acompañante, sin antecedente de convulsiones o delirium y con control diario; si no, hospitaliza [12].'));
    else if(a==='le') r.push(par('Abstinencia leve: manejo ambulatorio con control a las 24 h; sin benzodiacepina si el CIWA-Ar se mantiene en menos de 10 [12].'));
    if(wer) r.push(par('<b>Tiamina</b> 500 mg IV cada 8 h durante 2 a 3 días, luego 250 mg al día por 3 a 5 días [12][13] [VERIFICAR EN FUENTE]; antes de cualquier glucosa.'));
    else if(des) r.push(par('<b>Tiamina</b> parenteral 100 a 250 mg al día durante 3 a 5 días por la desnutrición, luego 100 mg VO cada 24 h; antes de cualquier glucosa [12] [VERIFICAR EN FUENTE].'));
    else r.push(par('<b>Tiamina</b> 100 mg VO cada 24 h durante la desintoxicación [12].'));
    if(a==='mo'||a==='gr'){
      if(h) r.push(par('Benzodiacepina con hepatopatía: <b>lorazepam</b> '+(a==='gr'?'2 a 4 mg':'1 a 2 mg')+' VO, IV o IM cada 4 a 6 h guiado por CIWA-Ar, o oxazepam 15 a 30 mg VO cada 6 a 8 h [12][5] [VERIFICAR EN FUENTE]. Evita diazepam: se acumula.'));
      else if(a==='mo') r.push(par('Benzodiacepina: <b>diazepam</b> 10 a 20 mg VO cada 1 a 2 h hasta CIWA-Ar menor de 10, luego según síntomas [12].'));
      else {
        var dz=peso?Math.min(rd(0.15*kg,1),10):10;
        r.push(par('Benzodiacepina: <b>diazepam</b> '+dcF(dz)+' mg IV lento por dosis, repetir según CIWA-Ar'+(peso?' (0,15 mg/kg para '+dcF(kg)+' kg; tope de 10 mg por dosis)':' (indica el peso para calcular 0,15 mg/kg; tope de 10 mg por dosis)')+' [12] [VERIFICAR EN FUENTE]. Vigila la ventilación.'));
      }
    }
    if(a==='no'||a==='le') r.push(par('Sin abstinencia que exija benzodiacepina; reevalúa con CIWA-Ar si reaparece el síntoma [12].'));
    if(p==='d'){
      var pre;
      if(h) pre='<b>Acamprosato</b> '+(peso&&kg<60?'666 mg por la mañana y 333 mg al mediodía y por la noche':(peso?'666 mg VO cada 8 h':'666 mg VO cada 8 h con 60 kg o más, o 666 mg por la mañana y 333 mg al mediodía y por la noche con menos de 60 kg'))+', 6 a 12 meses [VERIFICAR EN FUENTE]: no tiene metabolismo hepático. Evita naltrexona en hepatitis aguda o insuficiencia hepática y disulfiram en hepatopatía grave [17][5].';
      else pre='<b>Naltrexona</b> 50 mg VO cada 24 h, de 3 a 12 meses [VERIFICAR EN FUENTE], o <b>acamprosato</b> '+(peso&&kg<60?'666 mg por la mañana y 333 mg al mediodía y por la noche':(peso?'666 mg VO cada 8 h':'666 mg VO cada 8 h con 60 kg o más (menos de 60 kg, 1 332 mg al día)'))+'; ambos tras lograr la abstinencia. Disulfiram 250 mg VO cada 24 h solo con indicación y supervisión [17][5].';
      if(a==='no'||a==='le'||a==='mo') r.push(par('Prevención de recaídas: '+pre));
      else r.push(par('Prevención de recaídas: inicia tras superar la fase aguda y la abstinencia; '+pre));
      r.push(par('Apoyo psicosocial (entrevista motivacional, terapia cognitivo-conductual, grupos de ayuda mutua y apoyo familiar) y derivación a especialista [17][16].'));
    }
  }
  r.push('<span class="cf">Si la hepatopatía pasa de no a sí → el diazepam se cambia por lorazepam u oxazepam y la naltrexona por acamprosato [12][17].</span>');
  out(dc,r.join(''));
}
function dcSeg(dc){
  function P(t){return '<p>'+t+'</p>';}
  function has(a,v){return a.indexOf(v)>-1;}
  var g=sel(dc,'g');
  if(!g.length){out(dc,P('Elige los hallazgos del control para obtener la conducta: manejo en primer nivel, referencia a salud mental o referencia urgente a hospital.'));return;}
  var urg=[],amb=[],r=[];
  if(has(g,'sui')) urg.push('riesgo suicida: no lo dejes solo, retira medios letales y deriva a evaluación psiquiátrica urgente [16]');
  if(has(g,'conv')) urg.push('convulsión o delirium: urgencia vital con inestabilidad autonómica [12]');
  if(has(g,'wer')) urg.push('sospecha de Wernicke: tiamina parenteral antes de cualquier glucosa, posología en «Plan de tratamiento» [13]');
  if(has(g,'abs')) urg.push('abstinencia moderada o grave: requiere monitorización hospitalaria [12]');
  if(has(g,'hep')) urg.push('hepatopatía posiblemente descompensada: estudio y manejo hospitalario [13]');
  if(has(g,'emb')) amb.push('embarazo: obstetricia y salud mental, sin esperar al siguiente control [16]');
  if(has(g,'opi')) amb.push('policonsumo u opioides: centro de adicciones o salud mental por abstinencias combinadas y riesgo de sobredosis [16]');
  if(has(g,'dep')) amb.push('síntomas que persisten tras cerca de 1 mes de abstinencia: sugieren trastorno independiente, para salud mental [1]');
  if(has(g,'fra')) amb.push('fracaso ambulatorio: mayor intensidad de tratamiento [17]');
  if(has(g,'red')) amb.push('sin red de apoyo: la desintoxicación ambulatoria no es segura; suma trabajo social [17][12]');
  if(urg.length){
    r.push(P('<b>Referencia urgente a hospital</b>. Motivos: '+urg.join('; ')+'.'));
    if(amb.length) r.push(P('Además, para el especialista: '+amb.join('; ')+'.'));
  } else if(amb.length){
    r.push(P('<b>Referencia ambulatoria a salud mental o a centro de adicciones</b>. Motivos: '+amb.join('; ')+'. Mantén el seguimiento en el primer nivel mientras llega la cita [16].'));
  } else {
    r.push(P('<b>Manejo en el primer nivel</b>: no hay criterio de referencia. Revisa consumo, craving y adherencia, evalúa ánimo y riesgo suicida, y ajusta el plan; la recaída es parte del curso, no un fracaso [16][17].'));
  }
  if(has(g,'vio')) r.push(P('Violencia de pareja: pregunta por la seguridad de la pareja y los hijos, activa trabajo social y la ruta de protección; no se resuelve solo tratando el consumo [16].'));
  if(urg.length) r.push('<span class="cf">Si desaparecen los hallazgos urgentes y solo queda una recaída → vuelve al primer nivel con ajuste del plan, sin referencia [16][17].</span>');
  else if(amb.length) r.push('<span class="cf">Si aparece ideación suicida con plan o una convulsión → la referencia pasa de ambulatoria a urgente al hospital [16][12].</span>');
  else r.push('<span class="cf">Si se añade tristeza que persiste tras 1 mes sin beber → pasa a referencia ambulatoria a salud mental por probable trastorno independiente [1].</span>');
  out(dc,r.join(''));
}
</script>
