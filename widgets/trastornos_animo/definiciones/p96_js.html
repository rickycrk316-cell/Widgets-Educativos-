<script>
const TERMS={t1:'Trastornos del estado de ánimo',t2:'Angustia',t3:'Opresión precordial',t4:'Palpitaciones',t5:'Sudoración y náuseas',t6:'Preinfarto',t7:'Estrés',t8:'Stresstabs',t9:'Xanax (alprazolam)'};
const DECKS={
t1:[
{q:'¿Qué papel cumple la corteza prefrontal ventromedial sobre la amígdala y qué se observa si ese control falla?',a:'Frena la respuesta de la amígdala; si falla, la emoción se vuelve desproporcionada y persistente, y se nota en el examen mental.',h:'Es un control de arriba abajo.'},
{q:'Una persona pierde el interés y el placer por casi todo. ¿Qué vía monoaminérgica se relaciona con esa pérdida y de dónde nace?',a:'La dopamina, que nace en el área tegmental ventral y sostiene la motivación y la recompensa (la pérdida es anhedonia).',h:'Es la vía de la motivación y la recompensa.'},
{q:'¿Qué alteración central define a los trastornos del estado de ánimo según el DSM-5-TR y cómo los organiza?',a:'La alteración del ánimo (tristeza o pérdida de interés, exaltación o irritabilidad); los presenta en capítulos separados, depresivos y bipolares.',h:'El nombre ya indica la función afectada.'},
{q:'¿En qué se diferencia el ánimo normal de un trastorno del estado de ánimo?',a:'El ánimo normal fluctúa con el contexto y recupera su base; en el trastorno el estado de fondo queda fijo, no sigue lo que ocurre y cambia el funcionamiento.',h:'Piensa en el nivel del mar frente a las olas.'},
{q:'Un paciente tiene miedo y preocupación excesivos, sin cambio fijo del ánimo. ¿A qué grupo se acerca más y por qué no a los trastornos del estado de ánimo?',a:'A los trastornos de ansiedad: su alteración central es el miedo o la preocupación, no el ánimo.',h:'Fíjate en qué función está alterada.'}
],
t2:[
{q:'Un estímulo amenazante llega al tálamo. ¿Qué dos vías toma hacia la amígdala y qué respuesta del cuerpo se activa después?',a:'Una vía rápida directa y una lenta por la corteza sensorial; después el hipotálamo y el tronco activan el simpático: taquicardia, taquipnea y temblor.',h:'Una vía es veloz pero imprecisa; la otra, lenta y detallada.'},
{q:'¿Qué hace la ínsula con las señales del cuerpo y qué ocurre si las amplifica?',a:'Convierte las señales viscerales en sensación consciente; si las amplifica, un latido normal se vive como amenaza y alimenta el miedo.',h:'Es la corteza de la interocepción.'},
{q:'¿Cómo recoge el DSM-5-TR la vivencia de angustia con miedo a perder el control?',a:'Como síntoma del ataque de pánico: «miedo a perder el control o a volverse loco» dentro de un episodio brusco con pico en minutos.',h:'Es un síntoma de un episodio con pico rápido.'},
{q:'¿Qué separa la angustia de una crisis del miedo adaptativo?',a:'El miedo adaptativo responde a una amenaza real y es proporcional; la angustia aparece sin peligro proporcional.',h:'Mira si la amenaza era real.'},
{q:'Un paciente se siente separado de su cuerpo, como si se mirara desde fuera. ¿Es esta la angustia con miedo a perder el control?',a:'No: es despersonalización (extrañeza respecto de uno mismo); en la angustia lo central es el temor a perder el control.',h:'Una es extrañeza; la otra, temor.'}
],
t3:[
{q:'¿Por qué el dolor del corazón se siente en el brazo izquierdo o la mandíbula?',a:'Porque las fibras viscerales y las somáticas convergen en las mismas neuronas medulares (T1–T4) y el cerebro proyecta el dolor a la pared o al brazo.',h:'Piensa en la entrada común a la médula.'},
{q:'Si una arteria coronaria está estrecha y la demanda de oxígeno sube con el esfuerzo, ¿qué ocurre con el flujo y qué síntoma puede aparecer?',a:'El flujo no puede aumentar lo suficiente y el miocardio queda con poco oxígeno; aparece dolor opresivo precordial al esfuerzo.',h:'Falla la reserva de flujo.'},
{q:'¿Qué describe el término opresión precordial?',a:'Una característica del dolor torácico anterior: presión, peso o aplastamiento sentido sobre la región del corazón.',h:'Describe el síntoma, no la causa.'},
{q:'¿Cómo separas una opresión precordial de un dolor parietal u osteomuscular?',a:'El parietal se localiza con un dedo y se reproduce al palpar o mover la pared; la opresión es difusa y no se reproduce al tocar.',h:'Prueba a palpar la pared.'},
{q:'Un dolor retroesternal con ardor, que sube y se relaciona con las comidas, ¿es una opresión precordial?',a:'No: es pirosis (ardor ascendente ligado a las comidas y la posición); la opresión es presión, no quemazón.',h:'Se diferencian por el carácter del dolor.'}
],
t4:[
{q:'¿Qué hace la demora del nodo auriculoventricular y qué se palpa si el impulso no pasa a los ventrículos?',a:'Deja que las aurículas vacíen en los ventrículos antes de su sístole; si no pasa, los ventrículos laten con un ritmo de escape lento y el pulso es lento.',h:'El nodo AV actúa como compuerta entre dos cámaras.'},
{q:'¿Qué transmisor y qué receptor aceleran el nodo sinusal, y qué signo produce su descarga?',a:'Noradrenalina sobre receptores β1; produce taquicardia y latido más fuerte, que se palpa en el pulso.',h:'Es la rama simpática, la de la acción.'},
{q:'¿Cómo define la EHRA la palpitación?',a:'Percepción consciente y desagradable del propio latido cardiaco.',h:'La definición se centra en lo que siente la persona.'},
{q:'¿Qué separa una palpitación de una taquicardia objetiva?',a:'La palpitación es la percepción de la persona; la taquicardia es una frecuencia elevada medida en el pulso o el registro. Puede haber una sin la otra.',h:'Una se cuenta y la otra se refiere.'},
{q:'Una persona siente «un salto» en el pecho y al tomarle el pulso en ese momento es normal. ¿Sigue siendo una palpitación y por qué?',a:'Sí, porque la palpitación es una percepción; su presencia no exige que el pulso esté alterado.',h:'Piensa si el síntoma se define por el pulso o por lo que siente la persona.'}
],
t5:[
{q:'¿Qué transmisor liberan las fibras simpáticas que inervan las glándulas sudoríparas ecrinas y qué receptor lo recibe?',a:'Acetilcolina, sobre receptores muscarínicos; es una excepción del simpático, que usa noradrenalina en casi todo el resto.',h:'La glándula sudorípara rompe la regla de la noradrenalina.'},
{q:'¿Por qué el área postrema detecta sustancias de la sangre que no llegan a otras zonas del encéfalo, y a qué núcleo envía la señal?',a:'Porque no tiene una barrera hematoencefálica completa; envía la señal al núcleo del tracto solitario.',h:'Está en el piso del cuarto ventrículo.'},
{q:'¿Qué es la diaforesis?',a:'Sudoración profusa que no obedece al calor ni al ejercicio.',h:'El adjetivo clave es «no termorreguladora».'},
{q:'¿Qué rasgo de la piel separa la diaforesis neurovegetativa de la sudoración por calor?',a:'En la neurovegetativa la piel suele estar fría y pálida; en la termorreguladora, caliente y enrojecida.',h:'Piensa qué hace el simpático con los vasos de la piel.'},
{q:'Un paciente tiene náusea con sudor frío y palidez, sin comida ni dolor abdominal. ¿Qué tipo de náusea sugiere el cuadro y por qué?',a:'Náusea neurovegetativa, porque se acompaña de activación autonómica y no hay causa digestiva evidente.',h:'Mira los signos que acompañan a la náusea.'}
],
t6:[
{q:'¿Por qué la necrosis por isquemia empieza en el subendocardio?',a:'Porque es la capa más lejana de la luz coronaria epicárdica, recibe menos flujo y soporta más presión de pared durante la sístole.',h:'Piensa en riego y presión de pared.'},
{q:'Si la membrana del miocito se rompe, ¿qué proteína del sarcómero pasa a la sangre y cómo se detecta?',a:'La troponina cardiaca (T o I); se detecta midiéndola en una muestra de sangre.',h:'Es la proteína que fija el calcio y regula la contracción.'},
{q:'¿Qué término médico es el más cercano a «preinfarto»?',a:'Síndrome coronario agudo sin elevación del ST, en particular angina inestable.',h:'«Preinfarto» no figura en las clasificaciones.'},
{q:'¿Qué dato de laboratorio separa la angina inestable del infarto?',a:'La troponina cardiaca: no elevada en la angina inestable; elevada, con alza o caída, en el infarto.',h:'Piensa si hay muerte celular o no.'},
{q:'Un dolor torácico de pánico puede ser idéntico al de la isquemia. ¿Qué lo separa de la angina inestable?',a:'La demostración de isquemia (electrocardiograma y troponina); el síntoma por sí solo no los distingue.',h:'No se separan por cómo duele.'}
],
t7:[
{q:'Tras la liberación de CRH, ¿qué hormona hipofisaria se libera y qué secreta la suprarrenal en respuesta, y cómo se frena el eje?',a:'La hipófisis libera ACTH y la corteza suprarrenal secreta cortisol; el cortisol frena la CRH y la ACTH (retroalimentación negativa).',h:'El producto final apaga las dos hormonas anteriores.'},
{q:'¿Qué órgano libera adrenalina ante un estresor y qué signo cardiovascular produce en segundos?',a:'La médula suprarrenal (células cromafines, inervadas por fibras simpáticas preganglionares); produce taquicardia.',h:'Funciona como un ganglio simpático modificado.'},
{q:'Estrés: respuesta del organismo a un {{estresor}} que busca la adaptación (alostasis); si es repetida o prolongada, el desgaste acumulado se llama {{carga alostática}}.',a:'estresor; carga alostática',h:'McEwen nombra el desgaste con dos palabras que empiezan por «carga».'},
{q:'Un estudiante tiene el corazón rápido y las manos frías la noche antes de un examen, y todo cede al terminar. ¿Se trata de un trastorno de adaptación? ¿Por qué?',a:'No; es la respuesta adaptativa al estresor. El trastorno de adaptación exige malestar o deterioro desproporcionados al estresor.',h:'Fíjate en si la respuesta es proporcionada y transitoria.'},
{q:'¿Por qué «estrés» no es un diagnóstico del DSM-5-TR, a diferencia del trastorno de estrés agudo?',a:'Porque nombra una respuesta fisiológica a un estresor; el trastorno de estrés agudo es una entidad con criterios propios y exige un evento traumático.',h:'Una es respuesta general; la otra, categoría con criterios.'}
],
t8:[
{q:'¿Qué papel cumple una vitamina del complejo B convertida en coenzima y qué ocurre con la reacción si falta?',a:'Ayuda a una enzima a realizar su reacción; sin ella la reacción se enlentece y aparece el síndrome carencial correspondiente.',h:'La enzima necesita una herramienta para trabajar.'},
{q:'La tiamina forma pirofosfato de tiamina en la descarboxilación del piruvato. ¿Qué cuadros neurológicos aparecen si falta?',a:'Beriberi y encefalopatía de Wernicke.',h:'La neurona depende del metabolismo energético de la glucosa.'},
{q:'Stresstabs es un polivitamínico de venta libre con vitaminas del {{complejo B}} y vitamina {{C}}; algunas variantes añaden zinc o hierro.',a:'complejo B; C',h:'Una letra y una vitamina que aparece en el escorbuto.'},
{q:'¿Por qué Stresstabs no es un ansiolítico, aunque su nombre mencione el estrés?',a:'Aporta coenzimas y minerales para el metabolismo; no actúa sobre un receptor del sistema nervioso que module la ansiedad.',h:'Un ansiolítico actúa sobre un receptor, como el GABA-A.'},
{q:'¿Qué separa a Stresstabs de un complejo B inyectable?',a:'Stresstabs es una presentación oral de venta libre; el complejo B inyectable es una presentación parenteral, con preparación y vía distintas.',h:'Se diferencian por la vía.'}
],
t9:[
{q:'En el receptor GABA-A, ¿dónde se une la benzodiacepina y qué hace con el canal de Cl⁻ cuando hay GABA?',a:'En la interfaz α–γ; aumenta la frecuencia de apertura del canal, con más entrada de Cl⁻ e hiperpolarización.',h:'No abre el canal por sí sola: potencia al GABA.'},
{q:'¿Qué subunidad α se asocia con la sedación y cuáles con la ansiolisis?',a:'α1 con la sedación; α2 y α3 con la ansiolisis.',h:'La menor numeración se asocia con el efecto de dormir.'},
{q:'Una BZD de vida media corta hace que la concentración suba y baje entre dosis. ¿Qué se siente cuando cae en un cerebro adaptado?',a:'Reaparecen ansiedad e hiperexcitabilidad (caída interdosis), porque falta el refuerzo inhibitorio al que el cerebro se adaptó.',h:'El cerebro ya compensó la presencia del fármaco.'},
{q:'Alprazolam: triazolobenzodiacepina, {{modulador alostérico positivo}} del GABA-A; su vida media de eliminación en el adulto sano es de unas {{11 horas}} según la ficha.',a:'modulador alostérico positivo; 11 horas',h:'Es corta-intermedia, menor que la del diazepam.'},
{q:'¿Qué separa el mecanismo del alprazolam del de un ISRS?',a:'El alprazolam potencia el GABA-A (inhibición); el ISRS inhibe la recaptación de serotonina, con otro mecanismo y otro tiempo de inicio.',h:'Uno actúa sobre un canal iónico y el otro sobre un transportador.'}
]
};
DECKS.tg=[].concat.apply([],Object.keys(TERMS).map(function(k){return DECKS[k].map(function(c){return {q:c.q,a:c.a,h:c.h,t:k};});}));
const RC={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(k,s){return document.getElementById('rc-'+k+'-'+s);}
function isCloze(c){return c.q.indexOf('{{')>=0;}
function front(c){return esc(c.q).replace(/\{\{[^}]*\}\}/g,'[ ? ]');}
function back(c){return esc(c.q).replace(/\{\{([^}]*)\}\}/g,'<b>$1</b>');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function show(id,btn){
  document.querySelectorAll('.tab').forEach(function(s){s.classList.toggle('active',s.id===id);});
  document.querySelectorAll('.tb').forEach(function(b){b.classList.toggle('active',b===btn);});
  try{btn.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
}
function tog(b){b.parentElement.classList.toggle('op');}
function rc_reset(k){
  var n=DECKS[k].length,idx=[];
  for(var i=0;i<n;i++)idx.push(i);
  RC[k]={queue:shuffle(idx),first:{},fails:{},shown:false,done:0,n:n};
  if(el(k,'e'))el(k,'e').innerHTML='';
  rc_render(k);
}
function rc_render(k){
  var s=RC[k],card=el(k,'c');
  if(!card)return;
  if(!s.queue.length){rc_end(k);return;}
  var c=DECKS[k][s.queue[0]],f=s.fails[s.queue[0]]||0;
  el(k,'n').textContent='Tarjeta '+(s.done+1)+' de '+s.n+(k==='tg'&&s.shown?' · '+TERMS[c.t]:'');
  var h='<p class="rc-q">'+(s.shown&&isCloze(c)?back(c):front(c))+'</p>';
  if(s.shown&&!isCloze(c))h+='<p class="rc-a"><b>Respuesta.</b> '+esc(c.a)+'</p>';
  if(!s.shown&&f>=2)h+='<p class="rc-hint">Pista: '+esc(c.h)+'</p>';
  card.innerHTML=h;
  var b='';
  if(!s.shown){b+='<button class="go" onclick="rc_show(\''+k+'\')">Mostrar respuesta</button>';}
  else{
    b+='<button class="gr ok" onclick="rc_grade(\''+k+'\',\'ok\')">La sabía</button>';
    b+='<button class="gr mid" onclick="rc_grade(\''+k+'\',\'mid\')">A medias</button>';
    b+='<button class="gr ko" onclick="rc_grade(\''+k+'\',\'ko\')">No la sabía</button>';
  }
  b+='<button class="ghost" onclick="rc_reset(\''+k+'\')">Reiniciar mazo</button>';
  el(k,'b').innerHTML=b;
}
function rc_show(k){RC[k].shown=true;rc_render(k);}
function rc_grade(k,g){
  var s=RC[k],i=s.queue.shift();
  if(s.first[i]===undefined)s.first[i]=(g==='ok');
  if(g==='ok'){s.done++;}
  else{s.fails[i]=(s.fails[i]||0)+1;s.queue.push(i);}
  s.shown=false;
  rc_render(k);
}
function rc_verdict(p){return p>=80?['ok','Término consolidado']:['rep','Repasar hoy'];}
function rc_end(k){
  var s=RC[k],ok=0,i,rows='';
  for(i=0;i<s.n;i++)if(s.first[i])ok++;
  var p=Math.round(100*ok/s.n),v=rc_verdict(p);
  el(k,'n').textContent='Mazo completado';
  el(k,'c').innerHTML='<p class="rc-q">Cola agotada: todas las tarjetas se resolvieron.</p>';
  el(k,'b').innerHTML='<button class="ghost" onclick="rc_reset(\''+k+'\')">Reiniciar mazo</button>';
  var h='<div class="rc-end '+v[0]+'">Aciertos al primer intento: '+ok+' de '+s.n+' ('+p+' %). <b>'+v[1]+'</b>.</div>';
  if(k==='tg'){
    Object.keys(TERMS).forEach(function(t){
      var tot=0,hit=0;
      for(i=0;i<s.n;i++){if(DECKS.tg[i].t===t){tot++;if(s.first[i])hit++;}}
      var pp=Math.round(100*hit/tot),vv=rc_verdict(pp);
      rows+='<tr><td>'+esc(TERMS[t])+'</td><td>'+hit+' de '+tot+' ('+pp+' %)</td><td>'+vv[1]+'</td></tr>';
    });
    h+='<div class="tw"><table><thead><tr><th>Término</th><th>Aciertos 1er intento</th><th>Veredicto</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  el(k,'e').innerHTML=h;
}
Object.keys(DECKS).forEach(rc_reset);
</script>
</div></body></html>
